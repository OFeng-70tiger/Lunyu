<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论语 · 学而篇第一 · 交互式札记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #faf8f5;
            color: #2c2c2c;
            display: flex;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .app {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* 头部 */
        .header {
            border-bottom: 2px solid #d4c5a0;
            padding-bottom: 1.2rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: 6px;
            color: #3e2e1f;
        }

        .header .sub {
            color: #6b5a44;
            margin-top: 0.3rem;
            font-size: 1rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .header .sub span {
            background: #e8e0d4;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* 布局：目录 + 内容 */
        .main {
            display: flex;
            flex-direction: row;
            gap: 2.5rem;
            align-items: flex-start;
        }

        /* 侧边目录 */
        .toc {
            flex: 0 0 260px;
            background: #fffcf7;
            border: 1px solid #e2d7c8;
            border-radius: 18px;
            padding: 1.5rem 0.8rem 1.5rem 1.5rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 2rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        .toc h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4d3e2b;
            letter-spacing: 2px;
            border-bottom: 1px solid #dacfc0;
            padding-bottom: 0.8rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toc h2 small {
            font-weight: 400;
            font-size: 0.8rem;
            color: #8a7a64;
            margin-left: auto;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .toc-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #3d3429;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }

        .toc-list li:hover {
            background: #f0e9df;
            border-left-color: #b8a48a;
        }

        .toc-list li.active {
            background: #eadecd;
            border-left-color: #8b6f50;
            font-weight: 500;
            color: #2c1f12;
        }

        .toc-list li .badge {
            background: #dacfc0;
            color: #3e3225;
            font-size: 0.7rem;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            margin-left: auto;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .toc-list li .num {
            font-weight: 400;
            color: #8f7b62;
            min-width: 28px;
            font-size: 0.85rem;
        }

        /* 右侧内容区 */
        .content {
            flex: 1;
            background: #fffffffa;
            border: 1px solid #e8dfd3;
            border-radius: 20px;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02);
            min-height: 500px;
        }

        .chapter-card {
            display: none;
            animation: fadeUp 0.25s ease;
        }

        .chapter-card.active {
            display: block;
        }

        @keyframes fadeUp {
            0% { opacity: 0.6; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .chapter-card .ref {
            font-size: 0.9rem;
            color: #8a7a64;
            border-bottom: 1px dashed #ddd0c0;
            padding-bottom: 0.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
        }

        .chapter-card .ref .tag {
            background: #ede6db;
            padding: 0 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .chapter-card h3 {
            font-size: 1.8rem;
            font-weight: 400;
            color: #3d2d1c;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
        }

        .chapter-card .original {
            background: #f7f2ea;
            padding: 1rem 1.6rem;
            border-radius: 16px;
            font-size: 1.15rem;
            line-height: 1.8;
            color: #1f1a14;
            margin: 1.2rem 0 1.8rem 0;
            border-left: 6px solid #b7a084;
            font-weight: 450;
        }

        .chapter-card .annotation {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .chapter-card .annotation .block {
            background: #fcfaf7;
            padding: 0.8rem 1.4rem;
            border-radius: 14px;
            border: 1px solid #ece3d8;
        }

        .chapter-card .annotation .block strong {
            color: #5f4530;
            font-weight: 600;
            display: inline-block;
            min-width: 48px;
        }

        .chapter-card .annotation .deep {
            background: #f6f0e8;
            border-left: 4px solid #a3876b;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-top: 0.6rem;
            font-size: 0.98rem;
            line-height: 1.7;
            color: #2f261d;
        }

        .chapter-card .annotation .deep i {
            color: #6f5b45;
            font-style: normal;
            background: #e8ddd0;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.8rem;
            margin-right: 6px;
        }

        .meta-note {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #e3d8ca;
            font-size: 0.9rem;
            color: #756450;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.8rem;
            color: #826a4e;
            background: transparent;
            border: 1px solid #cbbba8;
            padding: 0.3rem 1.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }

        .back-link:hover {
            background: #e8ddd0;
            border-color: #9b846b;
        }

        /* 响应式 */
        @media (max-width: 820px) {
            .main {
                flex-direction: column;
            }
            .toc {
                flex: auto;
                width: 100%;
                position: relative;
                top: 0;
                max-height: none;
                padding: 1rem 1rem;
            }
            .toc-list {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 0.3rem;
            }
            .toc-list li {
                flex: 1 0 auto;
                padding: 0.3rem 0.8rem;
                border-left: none;
                border-bottom: 2px solid transparent;
            }
            .toc-list li.active {
                border-left: none;
                border-bottom-color: #8b6f50;
            }
            .content {
                padding: 1.5rem 1.2rem;
            }
            .chapter-card h3 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body { padding: 0.8rem; }
            .header h1 { font-size: 1.8rem; }
            .toc-list li .badge { display: none; }
        }
    </style>
</head>
<body>
<div class="app">

    <div class="header">
        <h1>📖 论语 · 学而篇第一</h1>
        <div class="sub">
            <span>📅 2026·09·09</span>
            <span>📘 共 9 章</span>
            <span>✍️ 约 207 字</span>
            <span>🧠 深读·交互</span>
        </div>
    </div>

    <div class="main">
        <!-- 目录 -->
        <nav class="toc" id="tocNav">
            <h2>
                📑 篇目
                <small>1.1 ~ 1.9</small>
            </h2>
            <ul class="toc-list" id="tocList">
                <!-- 由 js 动态生成 -->
            </ul>
            <div style="margin-top: 1.2rem; font-size: 0.8rem; color: #b09a82; border-top: 1px solid #e2d7c8; padding-top: 0.8rem;">
                ⚡ 点击章节跳转
            </div>
        </nav>

        <!-- 内容区 -->
        <div class="content" id="contentArea">
            <!-- 由 js 动态渲染 -->
        </div>
    </div>

    <!-- 底部统计 -->
    <div style="font-size: 0.9rem; color: #8c7a64; border-top: 1px solid #ddd0c0; padding-top: 1.2rem; display: flex; justify-content: space-between; flex-wrap: wrap;">
        <span>📚 今日进度：学而篇 1.1 — 1.9</span>
        <span>🔖 深度注解 · 字字落实</span>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 数据：全部 9 章
    // --------------------------------------------------------------
    const chapters = [{
        id: '1.1',
        title: '学而时习之',
        original: '子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”',
        annotation: [
            { label: '📌 时习', text: '“时”指适时、时常；“习”意为实践、温习。孔子强调知行合一，学了要能在生活中用出来。' },
            { label: '🎓 朋与友', text: '“朋”指同学、同门（同一老师门下）；“友”才是志同道合之人。同门远来，学问有共鸣，故“乐”。' },
            { label: '🧘 不愠', text: '“愠”是恼怒。别人不了解也不生气，君子的价值不依赖外界评价，内心自足。' },
        ],
        deep: '这三句话是修身三阶段：① 学而实践 → 内在之“悦”；② 同门切磋 → 外显之“乐”；③ 不为人知而不怨 → 人格自足。从“悦”到“乐”再到“不愠”，层层递进，指向独立完整的人格。'
    }, {
        id: '1.2',
        title: '孝悌为仁之本',
        original: '有子曰：“其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！”',
        annotation: [
            { label: '👨‍👧‍👦 孝弟', text: '“弟”通“悌”，敬爱兄长。孝悌是家庭伦理的核心，也是社会秩序的起点。' },
            { label: '🌱 务本', text: '君子致力根本，根本立住了，“道”自然生长。儒家不空谈大道，而是落实在人人可行的孝悌上。' },
        ],
        deep: '有子强调：家庭中的秩序感（孝悌）会自然延伸到社会——一个在家庭中懂得感恩和尊重的人，不会轻易犯上作乱。家庭是社会的最小单位，家庭伦理崩坏，社会必乱。“本立而道生”是儒家“下学而上达”的路径。'
    }, {
        id: '1.3',
        title: '巧言令色，鲜矣仁',
        original: '子曰：“巧言令色，鲜矣仁！”',
        annotation: [
            { label: '🎭 巧言', text: '花言巧语，把话说得动听但不真诚。' },
            { label: '🎨 令色', text: '“令”本义为“善、美”，“色”指面色、表情。“令色”即刻意装出和善的表情，是伪善的外在表现。' },
        ],
        deep: '孔子厌恶的不是“说话好听”或“表情和善”本身，而是“刻意”和“过度”——用言语和表情掩饰真实动机，目的是取悦他人、谋取私利。他推崇“刚毅木讷近仁”，因为真诚比漂亮更重要。'
    }, {
        id: '1.4',
        title: '吾日三省吾身',
        original: '曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”',
        annotation: [
            { label: '🔄 三省', text: '“三”指多次，非确数。每天从三个维度反省：忠、信、习。' },
            { label: '💼 忠', text: '“尽己之谓忠”——替人办事尽心竭力，不敷衍。' },
            { label: '🤝 信', text: '与朋友交往诚实守信，言行一致。' },
            { label: '📖 传不习', text: '老师传授的学问，有没有实践？这是对知识最大的尊重。' },
        ],
        deep: '曾子的反省覆盖了三种关系：对上级/委托者（忠）、对平辈/朋友（信）、对自身/学问（习）。这是一个完整的修身闭环——每天在这三个层面检视自己，才是真功夫。“省”字是关键：不是泛泛反思，而是具体到事上。'
    }, {
        id: '1.5',
        title: '道千乘之国',
        original: '子曰：“道千乘之国，敬事而信，节用而爱人，使民以时。”',
        annotation: [
            { label: '⚔️ 千乘之国', text: '“乘”指兵车，一乘约75人。千乘之国兵力约7.5万，在春秋属大国（如吴、越）。约相当于今一两个省。' },
            { label: '👑 敬事而信', text: '执政者对政事要敬畏、认真；言出必行，政策稳定。' },
            { label: '🌾 使民以时', text: '役使民众要在农闲时，不误农时。体现对百姓生存权和自然规律的尊重。' },
        ],
        deep: '这是孔子治国思想的浓缩：① 对上（权力）要“敬”与“信”——自我约束；② 对下（百姓）要“节用”与“爱人”——以民为本；③ 对时（自然）要“以时”——不违天时。核心是：执政者克制私欲，百姓福祉第一。越大越要克制，这是孔子的政治智慧。'
    }, {
        id: '1.6',
        title: '行有余力，则以学文',
        original: '子曰：“弟子入则孝，出则弟，谨而信，泛爱众，而亲仁。行有余力，则以学文。”',
        annotation: [
            { label: '🏠 入孝出弟', text: '在家孝顺父母，出门敬爱兄长。家庭伦理是人生第一课。' },
            { label: '❤️ 泛爱众而亲仁', text: '广泛爱众人，但要亲近有仁德的人——爱不是无差别的，要有价值判断。' },
            { label: '📚 行有余力则学文', text: '前面六件“行”做到了，还有余力，再去读书识字。德先于才，做人在先。' },
        ],
        deep: '孔子教育思想的根本次序：先做人，再读书。如果做人的根基没打好，读再多书也是白搭，甚至越读越坏（知识作恶）。这与今天“唯分数论”形成鲜明对比。'
    }, {
        id: '1.7',
        title: '虽曰未学，吾必谓之学矣',
        original: '子夏曰：“贤贤易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信。虽曰未学，吾必谓之学矣。”',
        annotation: [
            { label: '💎 贤贤易色', text: '第一个“贤”为动词（看重），第二个“贤”为名词（贤德），“易色”指轻视美色。价值观排序：德重于色。' },
            { label: '🛡️ 致其身', text: '事奉君主能献出生命，指全力以赴、不顾私利。' },
        ],
        deep: '子夏重新定义了“学”：四件事覆盖四伦——夫妻（贤贤易色）、父子（事父母）、君臣（事君）、朋友（与朋友交）。这四伦做到，人伦之道就完整了。“虽曰未学，吾必谓之学矣”——实践才是真学问，不识字也可以是有学问的人。与1.6“行有余力则以学文”一脉相承。'
    }, {
        id: '1.8',
        title: '过则勿惮改',
        original: '子曰：“君子不重则不威，学则不固。主忠信，无友不如己者。过则勿惮改。”',
        annotation: [
            { label: '⚖️ 重', text: '庄重、稳重。不庄重就没有威严，学的东西也不牢固。' },
            { label: '🧑‍🤝‍🧑 无友不如己者', text: '不和道德上不如自己的人深交（或理解为：没有朋友完全不如自己，要看到别人长处）。择友要慎重。' },
            { label: '🛠️ 过则勿惮改', text: '“惮”是害怕、畏难。有了过错不要怕改正——不要怕丢脸，不要拖延。' },
        ],
        deep: '君子四修：庄重（内在外在的统一）、忠信（立身之本）、慎友（环境影响）、改过（成长的关键）。最务实的是“过则勿惮改”——人非圣贤，错不可怕，可怕的是没勇气面对。'
    }, {
        id: '1.9',
        title: '慎终追远，民德归厚',
        original: '曾子曰：“慎终追远，民德归厚矣。”',
        annotation: [
            { label: '⚰️ 慎终', text: '慎重办理丧事。不是形式主义，而是通过仪式表达对父母的哀痛与感恩。' },
            { label: '🧬 追远', text: '追念远代祖先。把个人生命放到家族传承的长河中，培养“承上启下”的责任感。' },
        ],
        deep: '三层深意：① 形式背后的情感——丧祭之礼承载着“情”，是感恩的具象化表达；② 由家及国——孝从生前延伸到身后，从父母扩展到祖先，是“推恩”逻辑；③ 感恩是道德的总开关——知道“欠”父母的、欠祖先的，人就有了底线和敬畏。民风变“厚”，社会自然安稳。'
    }];

    // --------------------------------------------------------------
    // 渲染
    // --------------------------------------------------------------
    const tocList = document.getElementById('tocList');
    const contentArea = document.getElementById('contentArea');

    // 构建目录
    chapters.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.dataset.id = ch.id;
        li.innerHTML = `
            <span class="num">${ch.id}</span>
            <span>${ch.title}</span>
            <span class="badge">${ch.original.slice(0, 12)}…</span>
        `;
        li.addEventListener('click', () => {
            setActiveChapter(ch.id);
        });
        tocList.appendChild(li);
    });

    // 默认激活第一个
    let currentId = chapters[0].id;

    function setActiveChapter(id) {
        currentId = id;
        // 更新目录高亮
        document.querySelectorAll('.toc-list li').forEach(el => {
            el.classList.toggle('active', el.dataset.id === id);
        });
        // 渲染内容
        renderChapter(id);
        // 滚动到内容区（移动端友好）
        if (window.innerWidth <= 820) {
            contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function renderChapter(id) {
        const ch = chapters.find(c => c.id === id);
        if (!ch) return;

        // 构造注解html
        let annotationHtml = '';
        ch.annotation.forEach(a => {
            annotationHtml += `
                <div class="block">
                    <strong>${a.label}</strong> ${a.text}
                </div>
            `;
        });

        const html = `
            <div class="chapter-card active" id="card-${ch.id}">
                <div class="ref">
                    <span>📖 学而篇 · ${ch.id}</span>
                    <span class="tag">今日深读</span>
                </div>
                <h3>${ch.title}</h3>
                <div class="original">${ch.original}</div>

                <div class="annotation">
                    ${annotationHtml}
                </div>

                <div class="deep">
                    <i>🧠 内核</i> ${ch.deep}
                </div>

                <div class="meta-note">
                    <span>🔗 章节 ${ch.id}</span>
                    <span style="display: flex; gap: 0.8rem;">
                        <span id="prevBtn" style="cursor:pointer; color:#7f6952;">← 上一章</span>
                        <span id="nextBtn" style="cursor:pointer; color:#7f6952;">下一章 →</span>
                    </span>
                </div>
            </div>
        `;
        contentArea.innerHTML = html;

        // 绑定上一页/下一页
        const idx = chapters.findIndex(c => c.id === id);
        document.getElementById('prevBtn')?.addEventListener('click', () => {
            if (idx > 0) setActiveChapter(chapters[idx - 1].id);
        });
        document.getElementById('nextBtn')?.addEventListener('click', () => {
            if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id);
        });
    }

    // 启动：加载第一篇
    setActiveChapter(chapters[0].id);
