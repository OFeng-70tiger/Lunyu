<script>
var chapters = [
    {
        id: '9.9',
        title: '子见齐衰者',
        original: '子见齐衰者、冕衣裳者与瞽者，见之，虽少，必作；过之，必趋。',
        translation: '孔子见到穿丧服的人、穿礼服的人和盲人，即使对方年轻，也一定站起来；经过他们时，一定快步走。',
        annotation: [
            { label: '⚰️ 齐衰', text: '丧服。齐衰（zī cuī）。' },
            { label: '👔 冕衣裳者', text: '穿礼服的人。' },
            { label: '👁️ 瞽者', text: '盲人。' },
            { label: '🙇 必作', text: '一定站起来。' },
            { label: '🏃 必趋', text: '一定快步走。' }
        ],
        deep: '这句话写孔子的恭敬心：对穿丧服的人同情，对穿礼服的人尊重，对盲人体恤。对不同的人，都有相应的礼。与7.9“子食于有丧者之侧”一脉相承。'
    },
    {
        id: '9.10',
        title: '仰之弥高，钻之弥坚',
        original: '颜渊喟然叹曰：“仰之弥高，钻之弥坚。瞻之在前，忽焉在后。夫子循循然善诱人，博我以文，约我以礼，欲罢不能。既竭吾才，如有所立卓尔。虽欲从之，末由也已。”',
        translation: '颜渊感叹说：“老师的学问，越仰望越觉得高，越钻研越觉得坚固。看着在前面，忽然又在后面。老师善于有步骤地引导人，用文化知识丰富我，用礼来约束我，我想停止也停不下来。用尽我的才能，好像有所建树，卓然独立。虽然想跟上，却没有办法。”',
        annotation: [
            { label: '😮 喟然', text: '感叹的样子。' },
            { label: '⛰️ 仰之弥高', text: '越仰望越觉得高。' },
            { label: '💎 钻之弥坚', text: '越钻研越觉得坚固。' },
            { label: '🔄 瞻之在前，忽焉在后', text: '看着在前面，忽然又在后面。' },
            { label: '🧑‍🏫 循循然善诱人', text: '善于有步骤地引导人。' },
            { label: '📚 博我以文', text: '用文化知识丰富我。' },
            { label: '📏 约我以礼', text: '用礼来约束我。' },
            { label: '🚫 欲罢不能', text: '想停止也停不下来。' }
        ],
        deep: '这是颜渊对孔子的最高赞美，也是《论语》中最动人的师生篇章之一。仰之弥高，钻之弥坚，孔子的学问深不可测；循循然善诱人，孔子善于引导；博我以文，约我以礼，孔子教育的两大支柱；欲罢不能，颜渊学得停不下来。“循循善诱”是成语，出自这里。'
    },
    {
        id: '9.11',
        title: '子路使门人为臣',
        original: '子疾病，子路使门人为臣。病间，曰：“久矣哉，由之行诈也！无臣而为有臣。吾谁欺？欺天乎？且予与其死于臣之手也，无宁死于二三子之手乎？且予纵不得大葬，予死于道路乎？”',
        translation: '孔子病重，子路让弟子充当家臣。病情好转后，孔子说：“仲由做这种骗人的事很久了！没有家臣却装作有家臣。我欺骗谁？欺骗天吗？况且我与其死在家臣手里，不如死在你们手里。即使我不能得到隆重葬礼，我会死在路上吗？”',
        annotation: [
            { label: '🤒 疾病', text: '病重。' },
            { label: '👥 使门人为臣', text: '让弟子充当家臣。' },
            { label: '📉 病间', text: '病情好转。' },
            { label: '🎭 行诈', text: '做骗人的事。' },
            { label: '❓ 吾谁欺', text: '我欺骗谁？' },
            { label: '⚡ 欺天乎', text: '欺骗天吗？' },
            { label: '⚰️ 大葬', text: '隆重的葬礼。' }
        ],
        deep: '子路想给孔子办一个体面的葬礼，让弟子冒充家臣。孔子严厉批评：没有就是没有，不能弄虚作假。孔子宁可死得朴素，也不愿死得虚伪。这是孔子对“诚”的坚持。与9.4“子绝四”一脉相承。'
    },
    {
        id: '9.12',
        title: '有美玉于斯',
        original: '子贡曰：“有美玉于斯，韫椟而藏诸？求善贾而沽诸？”子曰：“沽之哉！沽之哉！我待贾者也。”',
        translation: '子贡说：“这里有一块美玉，是藏在匣子里呢？还是找一个识货的商人卖掉呢？”孔子说：“卖掉吧！卖掉吧！我正等着识货的人呢。”',
        annotation: [
            { label: '💎 美玉', text: '比喻人才。' },
            { label: '📦 韫椟', text: '藏在匣子里。韫（yùn），藏。椟，匣子。' },
            { label: '🛒 善贾', text: '识货的商人。贾（gǔ），商人。' },
            { label: '💰 沽', text: '卖。沽（gū）。' },
            { label: '⏳ 待贾者', text: '等待识货的人。' }
        ],
        deep: '子贡用美玉比喻孔子，问他是隐居还是出仕。孔子说：卖掉吧，我等着识货的人。孔子不拒绝出仕，但要有识货的君主。与8.13“天下有道则见，无道则隐”一脉相承。'
    },
    {
        id: '9.13',
        title: '子欲居九夷',
        original: '子欲居九夷。或曰：“陋，如之何？”子曰：“君子居之，何陋之有？”',
        translation: '孔子想搬到九夷去住。有人说：“那里太简陋了，怎么办？”孔子说：“君子住那里，有什么简陋的？”',
        annotation: [
            { label: '🌍 九夷', text: '东方少数民族地区。' },
            { label: '🏚️ 陋', text: '简陋、落后。' },
            { label: '❓ 如之何', text: '怎么办？' },
            { label: '✨ 何陋之有', text: '有什么简陋的？' }
        ],
        deep: '孔子想去边远地区，有人说那里落后。孔子说：君子住那里，就不简陋了。“何陋之有”是成语，出自这里。君子到哪里，哪里就有文明。与6.11“君子儒”一脉相承。'
    },
    {
        id: '9.14',
        title: '吾自卫反鲁，然后乐正',
        original: '子曰：“吾自卫反鲁，然后乐正，《雅》《颂》各得其所。”',
        translation: '孔子说：“我从卫国回到鲁国，然后音乐得到整理，《雅》《颂》各自回到合适的位置。”',
        annotation: [
            { label: '🔙 自卫反鲁', text: '从卫国回到鲁国。' },
            { label: '🎵 乐正', text: '音乐得到整理。' },
            { label: '📖 《雅》《颂》', text: '《诗经》的雅、颂部分。' },
            { label: '✅ 各得其所', text: '各自回到合适的位置。' }
        ],
        deep: '孔子晚年回到鲁国，整理音乐，使《雅》《颂》各归其位。这是孔子对文化传承的巨大贡献。与7.1“述而不作，信而好古”一脉相承。'
    },
    {
        id: '9.15',
        title: '出则事公卿，入则事父兄',
        original: '子曰：“出则事公卿，入则事父兄，丧事不敢不勉，不为酒困，何有于我哉？”',
        translation: '孔子说：“在外侍奉公卿，在家侍奉父兄，办丧事不敢不尽力，不被酒困扰，这些我做到了哪些呢？”',
        annotation: [
            { label: '🏛️ 出', text: '在外。事公卿：侍奉公卿。' },
            { label: '🏠 入', text: '在家。事父兄：侍奉父兄。' },
            { label: '⚰️ 丧事不敢不勉', text: '办丧事不敢不尽力。' },
            { label: '🍶 不为酒困', text: '不被酒困扰。' },
            { label: '❓ 何有于我哉', text: '这些我做到了哪些呢？' }
        ],
        deep: '孔子列出四件日常事：对上级恭敬，对家人孝顺，对逝者尽心，对自己节制。这四件看似简单，做好极难。与7.33“躬行君子”一脉相承。'
    },
    {
        id: '9.16',
        title: '逝者如斯夫，不舍昼夜',
        original: '子在川上，曰：“逝者如斯夫！不舍昼夜。”',
        translation: '孔子站在河边，说：“流逝的时光就像这河水啊！日夜不停地流。”',
        annotation: [
            { label: '🌊 川上', text: '河边。' },
            { label: '⏳ 逝者', text: '流逝的时光。' },
            { label: '💧 如斯', text: '像这样。' },
            { label: '🌙 不舍昼夜', text: '日夜不停。' }
        ],
        deep: '这是《论语》中最著名的感叹之一。孔子站在河边，感叹时光如流水，日夜不停。这是对生命短暂的感慨，也是对珍惜时光的提醒。与8.17“学如不及，犹恐失之”一脉相承。'
    }
];

var tocList = document.getElementById('tocList');
var contentArea = document.getElementById('contentArea');

chapters.forEach(function(ch) {
    var li = document.createElement('li');
    li.dataset.id = ch.id;
    li.innerHTML = '<span class="num">' + ch.id + '</span><span>' + ch.title + '</span><span class="badge">…</span>';
    li.addEventListener('click', function() { setActiveChapter(ch.id); });
    tocList.appendChild(li);
});

function setActiveChapter(id) {
    document.querySelectorAll('.toc-list li').forEach(function(el) {
        el.classList.toggle('active', el.dataset.id === id);
    });
    renderChapter(id);
    if (window.innerWidth <= 820) {
        contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function renderChapter(id) {
    var ch = null;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === id) { ch = chapters[i]; break; }
    }
    if (!ch) return;
    var annotationHtml = '';
    ch.annotation.forEach(function(a) {
        annotationHtml += '<div class="block"><strong>' + a.label + '</strong> ' + a.text + '</div>';
    });
    contentArea.innerHTML = '<div class="chapter-card active">' +
        '<div class="top-nav">' +
        '<div class="ref-left">📖 子罕篇 · ' + ch.id + '<span class="tag">第二十九天</span></div>' +
        '<div class="day-nav">' +
        '<a href="day28.html" class="day-btn">← 前一天</a>' +
        '<span class="day-label">📅 第二十九天</span>' +
        '<a href="day30.html" class="day-btn">后一天 →</a>' +
        '</div>' +
        '</div>' +
        '<h3>' + ch.title + '</h3>' +
        '<div class="original">' + ch.original + '</div>' +
        '<div class="translation"><strong>白话译文：</strong>' + ch.translation + '</div>' +
        '<div class="annotation">' + annotationHtml + '</div>' +
        '<div class="deep"><i>🧠 内核</i> ' + ch.deep + '</div>' +
        '<div class="meta-note">' +
        '<span>🔗 章节 ' + ch.id + '</span>' +
        '<span style="display:flex;gap:0.8rem;">' +
        '<span id="prevBtn" style="cursor:pointer;color:#7f6952;">← 上一章</span>' +
        '<span id="nextBtn" style="cursor:pointer;color:#7f6952;">下一章 →</span>' +
        '</span></div></div>';

    var idx = -1;
    for (var j = 0; j < chapters.length; j++) {
        if (chapters[j].id === id) { idx = j; break; }
    }
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    if (prevBtn) {
        prevBtn.addEventListener('click', function() {
            if (idx > 0) setActiveChapter(chapters[idx - 1].id);
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id);
        });
    }
}

(function() {
    var hash = window.location.hash.replace('#', '');
    var found = false;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === hash) { found = true; break; }
    }
    setActiveChapter(found ? hash : chapters[0].id);
})();
</script>
</body>
</html>
