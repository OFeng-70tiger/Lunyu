<script>
var chapters = [
    {
        id: '11.1',
        title: '先进于礼乐，野人也',
        original: '子曰：“先进于礼乐，野人也；后进于礼乐，君子也。如用之，则吾从先进。”',
        translation: '孔子说：“先学习礼乐而后做官的，是平民；先做官而后学习礼乐的，是贵族。如果要任用人才，我选先学习礼乐的。”',
        annotation: [
            { label: '📚 先进', text: '先学习礼乐。' },
            { label: '🌾 野人', text: '乡野之人，指平民。' },
            { label: '📚 后进', text: '后学习礼乐。' },
            { label: '👑 君子', text: '这里指贵族。' },
            { label: '✅ 如用之', text: '如果任用。' },
            { label: '👍 吾从先进', text: '我选先进。' }
        ],
        deep: '孔子讲用人标准：先进于礼乐，先学礼乐，再做官——平民；后进于礼乐，先做官，再学礼乐——贵族。孔子选“先进”，说明他看重的是真才实学，不是出身。与6.5“犁牛之子”一脉相承。'
    },
    {
        id: '11.2',
        title: '从我于陈蔡者',
        original: '子曰：“从我于陈、蔡者，皆不及门也。”',
        translation: '孔子说：“跟随我在陈国、蔡国受困的弟子们，现在都不在我门下了。”',
        annotation: [
            { label: '👥 从', text: '跟随。' },
            { label: '📍 陈、蔡', text: '陈国和蔡国。' },
            { label: '🚪 不及门', text: '不在门下。' }
        ],
        deep: '孔子怀念当年患难与共的弟子。陈蔡之困，是最艰难的时刻，弟子们不离不弃。现在都不在了。这是孔子晚年的感伤。与7.5“甚矣吾衰也”一脉相承。'
    },
    {
        id: '11.3',
        title: '四科十哲',
        original: '德行：颜渊、闵子骞、冉伯牛、仲弓。言语：宰我、子贡。政事：冉有、季路。文学：子游、子夏。',
        translation: '德行方面：颜渊、闵子骞、冉伯牛、仲弓。言语方面：宰我、子贡。政事方面：冉有、季路。文学方面：子游、子夏。',
        annotation: [
            { label: '❤️ 德行', text: '道德修养。' },
            { label: '👤 颜渊等', text: '颜渊、闵子骞、冉伯牛、仲弓，四弟子。' },
            { label: '🗣️ 言语', text: '言辞、外交。' },
            { label: '👤 宰我等', text: '宰我、子贡，两弟子。' },
            { label: '🏛️ 政事', text: '政务。' },
            { label: '👤 冉有等', text: '冉有、季路，两弟子。' },
            { label: '📚 文学', text: '文化典籍。' },
            { label: '👤 子游等', text: '子游、子夏，两弟子。' }
        ],
        deep: '这是孔门四科十哲，孔子的十大弟子按四种专长分类：德行、言语、政事、文学。孔子因材施教，弟子各有所长。与6.7“三弟子从政”一脉相承。'
    },
    {
        id: '11.4',
        title: '回也非助我者也',
        original: '子曰：“回也非助我者也，于吾言无所不说。”',
        translation: '孔子说：“颜回不是帮助我的人，他对我的话没有不喜欢的。”',
        annotation: [
            { label: '👤 回', text: '颜回。' },
            { label: '❓ 非助我者', text: '不是帮助我的人。' },
            { label: '😊 无所不说', text: '没有不喜欢的。说，通“悦”。' }
        ],
        deep: '孔子表面批评颜回，实则赞叹。颜回对孔子的话全盘接受，从不质疑。但孔子也说“非助我者”——因为不质疑，就不能帮助老师进步。与2.9“不违如愚”一脉相承。'
    },
    {
        id: '11.5',
        title: '孝哉闵子骞',
        original: '子曰：“孝哉闵子骞！人不间于其父母昆弟之言。”',
        translation: '孔子说：“闵子骞真孝顺啊！人们对他父母兄弟称赞他的话没有非议。”',
        annotation: [
            { label: '👤 闵子骞', text: '孔子弟子。' },
            { label: '🚫 不间', text: '没有非议。间，非议。' },
            { label: '👨‍👩‍👦 父母昆弟', text: '父母兄弟。' }
        ],
        deep: '孔子赞闵子骞孝。人们对他父母兄弟的称赞，没有人质疑。这是真孝，经得起检验。与1.2“孝悌为仁之本”一脉相承。'
    },
    {
        id: '11.6',
        title: '南容三复白圭',
        original: '南容三复白圭，孔子以其兄之子妻之。',
        translation: '南容反复诵读关于白圭的诗句，孔子把侄女嫁给了他。',
        annotation: [
            { label: '👤 南容', text: '南宫适，孔子弟子。' },
            { label: '🔁 三复', text: '反复诵读。' },
            { label: '💎 白圭', text: '《诗经》中关于白圭的诗句，讲谨慎。' },
            { label: '👰 以其兄之子妻之', text: '把侄女嫁给他。' }
        ],
        deep: '“白圭”诗句讲慎言。南容反复诵读，说明他注重修养。孔子把侄女嫁给他，是看重他的德行。与5.2“子谓南容”一脉相承。'
    },
    {
        id: '11.7',
        title: '弟子孰为好学',
        original: '季康子问：“弟子孰为好学？”孔子对曰：“有颜回者好学，不幸短命死矣，今也则亡。”',
        translation: '季康子问：“你的弟子中谁最好学？”孔子回答说：“有个叫颜回的好学，不幸短命死了，现在没有这样的人了。”',
        annotation: [
            { label: '👤 季康子', text: '鲁国大夫。' },
            { label: '❓ 孰', text: '谁。' },
            { label: '📚 好学', text: '爱好学习。' },
            { label: '💀 短命死', text: '颜回早逝。' },
            { label: '🚫 亡', text: '通“无”。' }
        ],
        deep: '这句话与6.3重复。孔子再次痛惜颜回。颜回死后，孔子再也没找到这么好学的弟子。与6.3“不幸短命死矣”一脉相承。'
    },
    {
        id: '11.8',
        title: '颜路请子之车以为之椁',
        original: '颜渊死，颜路请子之车以为之椁。子曰：“才不才，亦各言其子也。鲤也死，有棺而无椁。吾不徒行以为之椁。以吾从大夫之后，不可徒行也。”',
        translation: '颜渊死了，颜路请求孔子的车用来做椁。孔子说：“不管有才没才，也都是各自说自己的儿子。孔鲤死时，也只有内棺没有外棺。我不能步行来给他做椁。因为我曾做过大夫，不可以步行。”',
        annotation: [
            { label: '👤 颜路', text: '颜回的父亲。' },
            { label: '🚗 请子之车', text: '请求孔子的车。' },
            { label: '⚰️ 以为之椁', text: '用来做椁。椁（guǒ），外棺。' },
            { label: '🤔 才不才', text: '有才没才。' },
            { label: '👨‍👦 亦各言其子也', text: '也都是各自说自己的儿子。' },
            { label: '👤 鲤', text: '孔子的儿子孔鲤。' },
            { label: '⚰️ 有棺而无椁', text: '只有内棺没有外棺。' },
            { label: '🚶 吾不徒行', text: '我不步行。' },
            { label: '🏛️ 从大夫之后', text: '跟在大夫后面，指做过大夫。' }
        ],
        deep: '颜回死了，颜路想用孔子的车换椁。孔子拒绝，理由：孔鲤死时，也只有棺没有椁；我曾做过大夫，不可步行。孔子不因私情而违礼。与10.15“康子馈药”一脉相承。'
    },
    {
        id: '11.9',
        title: '天丧予',
        original: '颜渊死，子曰：“噫！天丧予！天丧予！”',
        translation: '颜渊死了，孔子说：“唉！上天要我的命啊！上天要我的命啊！”',
        annotation: [
            { label: '😢 噫', text: '感叹词。' },
            { label: '💀 天丧予', text: '上天要我的命啊。' }
        ],
        deep: '这是《论语》中最悲痛的章节之一。颜回死了，孔子连说两遍“天丧予”。颜回是孔子最得意的弟子，他的死，孔子像失去了自己的一部分。与11.7“今也则亡”一脉相承。'
    }
];

var tocList = document.getElementById('tocList');
var contentArea = document.getElementById('contentArea');

chapters.forEach(function(ch) {
    var li = document.createElement('li');
    li.dataset.id = ch.id;
    li.innerHTML = '<span class="num">' + ch.id + '</span><span>' + ch.title + '</span><span class="badge">…</span>';
    li.addEventListener('click', function() { setActiveChapter(ch.id); });
    tocList.appendChild(li);
});

function setActiveChapter(id) {
    document.querySelectorAll('.toc-list li').forEach(function(el) {
        el.classList.toggle('active', el.dataset.id === id);
    });
    renderChapter(id);
    if (window.innerWidth <= 820) {
        contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function renderChapter(id) {
    var ch = null;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === id) { ch = chapters[i]; break; }
    }
    if (!ch) return;
    var annotationHtml = '';
    ch.annotation.forEach(function(a) {
        annotationHtml += '<div class="block"><strong>' + a.label + '</strong> ' + a.text + '</div>';
    });
    contentArea.innerHTML = '<div class="chapter-card active">' +
        '<div class="top-nav">' +
        '<div class="ref-left">📖 先进篇 · ' + ch.id + '<span class="tag">第三十五天</span></div>' +
        '<div class="day-nav">' +
        '<a href="day34.html" class="day-btn">← 前一天</a>' +
        '<span class="day-label">📅 第三十五天</span>' +
        '<a href="day36.html" class="day-btn">后一天 →</a>' +
        '</div>' +
        '</div>' +
        '<h3>' + ch.title + '</h3>' +
        '<div class="original">' + ch.original + '</div>' +
        '<div class="translation"><strong>白话译文：</strong>' + ch.translation + '</div>' +
        '<div class="annotation">' + annotationHtml + '</div>' +
        '<div class="deep"><i>🧠 内核</i> ' + ch.deep + '</div>' +
        '<div class="meta-note">' +
        '<span>🔗 章节 ' + ch.id + '</span>' +
        '<span style="display:flex;gap:0.8rem;">' +
        '<span id="prevBtn" style="cursor:pointer;color:#7f6952;">← 上一章</span>' +
        '<span id="nextBtn" style="cursor:pointer;color:#7f6952;">下一章 →</span>' +
        '</span></div></div>';

    var idx = -1;
    for (var j = 0; j < chapters.length; j++) {
        if (chapters[j].id === id) { idx = j; break; }
    }
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    if (prevBtn) {
        prevBtn.addEventListener('click', function() {
            if (idx > 0) setActiveChapter(chapters[idx - 1].id);
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id);
        });
    }
}

(function() {
    var hash = window.location.hash.replace('#', '');
    var found = false;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === hash) { found = true; break; }
    }
    setActiveChapter(found ? hash : chapters[0].id);
})();
</script>
