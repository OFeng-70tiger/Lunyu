<script>
var chapters = [
    {
        id: '3.1',
        title: '八佾舞于庭',
        original: '孔子谓季氏：“八佾舞于庭，是可忍也，孰不可忍也？”',
        translation: '孔子谈到季氏时说：“他用六十四人在庭院中奏乐舞蹈，这都可以容忍的话，还有什么不可以容忍呢？”',
        annotation: [
            { label: '👤 季氏', text: '鲁国大夫季孙氏，权臣。' },
            { label: '💃 八佾', text: '古代舞蹈奏乐的行列，八人一行叫一佾。八佾就是八行，共六十四人。按周礼，只有天子才能用八佾，诸侯用六佾，大夫用四佾。' },
            { label: '⚠️ 僭越', text: '季氏是大夫，只能用四佾（三十二人），却用了天子的八佾（六十四人）。这是严重的僭越。' }
        ],
        deep: '孔子说“是可忍也，孰不可忍也”，不是说他个人忍不了，而是说这种事如果都能容忍，那还有什么礼制可言？礼崩乐坏，就是从这种僭越开始的。这与2.3“道之以德，齐之以礼”一脉相承：孔子一生最痛心的就是礼制的崩坏。'
    },
    {
        id: '3.2',
        title: '三家者以《雍》彻',
        original: '三家者以《雍》彻。子曰：“‘相维辟公，天子穆穆’，奚取于三家之堂？”',
        translation: '三家在祭祀完毕后，用天子的《雍》诗来撤去祭品。孔子说：“《雍》诗上说‘助祭的是诸侯，天子庄严肃穆’，这样的诗句怎么能用在三家大夫的庙堂上呢？”',
        annotation: [
            { label: '👥 三家', text: '鲁国三大权臣家族——孟孙氏、叔孙氏、季孙氏。' },
            { label: '📖 《雍》', text: '《诗经·周颂》中的一篇，天子祭祀宗庙后撤去祭品时所唱。' },
            { label: '🚫 僭越', text: '三家是大夫，按礼制不能用天子的乐诗。但他们不仅用了，还堂而皇之地在自家庙堂上演奏。' }
        ],
        deep: '这与3.1一脉相承：僭越礼制，就是破坏秩序。孔子引诗讽刺，不是抠字眼，而是指出：礼制不是形式，它承载着秩序和名分。名分一乱，天下就乱了。'
    },
    {
        id: '3.3',
        title: '人而不仁，如礼何',
        original: '子曰：“人而不仁，如礼何？人而不仁，如乐何？”',
        translation: '孔子说：“一个人没有仁德，礼对他还有什么用呢？一个人没有仁德，乐对他还有什么用呢？”',
        annotation: [
            { label: '❤️ 不仁', text: '没有仁德。' },
            { label: '📋 如礼何', text: '把礼怎么办？意思是礼对他还有什么用？' },
            { label: '🎵 如乐何', text: '把乐怎么办？意思是乐对他还有什么用？' }
        ],
        deep: '这是八佾篇的核心命题。礼乐不是外在的形式，而是内在仁德的表现。一个人如果没有仁德，就算他把礼乐表演得再完美，也只是空壳。这与2.3“道之以德，齐之以礼”一脉相承：德是里，礼是表；仁是内核，礼乐是形式。'
    },
    {
        id: '3.4',
        title: '林放问礼之本',
        original: '林放问礼之本。子曰：“大哉问！礼，与其奢也，宁俭；丧，与其易也，宁戚。”',
        translation: '林放问礼的根本是什么。孔子说：“问得好啊！礼，与其铺张浪费，不如俭朴；丧礼，与其办得周全却缺乏真情，不如内心真正悲伤。”',
        annotation: [
            { label: '👤 林放', text: '鲁国人，一说孔子弟子。' },
            { label: '🎯 大哉问', text: '问得好啊！' },
            { label: '💰 奢与俭', text: '礼的排场，与其铺张，不如俭朴。因为俭朴至少不失真诚，铺张往往流于炫耀。' },
            { label: '😢 易与戚', text: '丧礼，与其办得周全却缺乏真情，不如内心真正悲伤。丧礼的核心是哀痛，不是排场。' }
        ],
        deep: '林放问“礼的根本”，孔子没有直接回答，而是用两个对比来说明：礼的根本不在形式，而在真情。这与1.9“慎终追远”、2.7“不敬何以别乎”、2.8“色难”一脉相承：孔子始终把真情放在形式之上。'
    },
    {
        id: '3.5',
        title: '夷狄之有君，不如诸夏之亡也',
        original: '子曰：“夷狄之有君，不如诸夏之亡也。”',
        translation: '孔子说：“夷狄虽然有君主，还不如中原各国没有君主呢。”',
        annotation: [
            { label: '🌍 夷狄', text: '古代对周边少数民族的称呼。' },
            { label: '🏛️ 诸夏', text: '中原华夏各国。' },
            { label: '🚫 亡', text: '通“无”，没有。' }
        ],
        deep: '这句话历来争议很大。通常的理解是：夷狄虽然有君主，但没有礼制；中原各国虽然有时没有君主，但有礼制。在孔子看来，礼制比君主更重要。一个社会的根本，不是有没有统治者，而是有没有礼制秩序。'
    },
    {
        id: '3.6',
        title: '季氏旅于泰山',
        original: '季氏旅于泰山。子谓冉有曰：“女弗能救与？”对曰：“不能。”子曰：“呜呼！曾谓泰山不如林放乎？”',
        translation: '季氏要去祭祀泰山。孔子对冉有说：“你不能阻止他吗？”冉有回答说：“不能。”孔子说：“唉！难道说泰山之神还不如林放懂礼吗？”',
        annotation: [
            { label: '⛰️ 旅', text: '祭祀山川。按礼制，只有天子才能祭祀泰山，诸侯只能祭祀自己境内的山川。' },
            { label: '👤 冉有', text: '孔子弟子，当时是季氏的家臣。' },
            { label: '🛑 救', text: '阻止。' },
            { label: '🤔 曾谓', text: '难道说。林放：前面问礼之本的那个人。' }
        ],
        deep: '季氏是鲁国大夫，按礼制只能祭祀自己境内的山川，不能祭祀泰山。泰山是天子的祭祀对象。季氏去祭泰山，又是僭越。孔子感叹：难道泰山之神还不如林放懂礼吗？林放一个普通人都知道问礼之本，泰山之神难道会接受不合礼制的祭祀吗？'
    },
    {
        id: '3.7',
        title: '君子无所争，必也射乎',
        original: '子曰：“君子无所争，必也射乎！揖让而升，下而饮，其争也君子。”',
        translation: '孔子说：“君子没有什么可争的，如果一定要争，那就是射箭吧！作揖谦让然后登堂，射完后下堂饮酒，这种竞争是君子式的竞争。”',
        annotation: [
            { label: '🏹 射', text: '射箭，古代六艺之一。' },
            { label: '🙇 揖让而升', text: '作揖谦让，然后登堂。' },
            { label: '🍷 下而饮', text: '射完后下堂，饮酒。' },
            { label: '💡 核心', text: '竞争可以有，但竞争的方式要符合礼。争而不失礼，胜而不骄人，败而不怨人。' }
        ],
        deep: '这句话讲的是君子之争。君子不争，但并非完全不争——射箭是比赛，有胜负，但争的方式是君子式的。这与1.12“礼之用，和为贵”、2.14“君子周而不比”一脉相承：君子有原则，但不排他；有竞争，但不失礼。'
    },
    {
        id: '3.8',
        title: '巧笑倩兮，美目盼兮',
        original: '子夏问曰：“‘巧笑倩兮，美目盼兮，素以为绚兮。’何谓也？”子曰：“绘事后素。”曰：“礼后乎？”子曰：“起予者商也！始可与言《诗》已矣。”',
        translation: '子夏问：“‘巧笑倩兮，美目盼兮，素以为绚兮’，这几句诗是什么意思？”孔子说：“先有白底，然后才能画画。”子夏说：“礼是不是在（仁之后）？”孔子说：“能启发我的人是你啊，商！现在可以和你谈《诗》了。”',
        annotation: [
            { label: '📖 诗句', text: '出自《诗经·卫风·硕人》，形容女子笑容美好、眼睛明亮。' },
            { label: '🎨 绘事后素', text: '先有白底，然后才能画画。' },
            { label: '📋 礼后乎', text: '礼是不是在（仁之后）？意思是：仁是白底，礼是彩绘；先有仁德，然后才有礼。' },
            { label: '🌟 起予者商也', text: '能启发我的人是你啊，商（子夏的名）。' }
        ],
        deep: '这是八佾篇最生动的一章。子夏问《诗经》里的几句描写美人的诗，孔子答“绘事后素”——先有白底，才能画画。子夏立刻联想到：礼是不是也在仁之后？孔子大为赞赏。这与3.3“人而不仁，如礼何”、3.4“礼之本”一脉相承：仁是根本，礼是表现。'
    }
];

var tocList = document.getElementById('tocList');
var contentArea = document.getElementById('contentArea');

chapters.forEach(function(ch) {
    var li = document.createElement('li');
    li.dataset.id = ch.id;
    li.innerHTML = '<span class="num">' + ch.id + '</span><span>' + ch.title + '</span><span class="badge">…</span>';
    li.addEventListener('click', function() { setActiveChapter(ch.id); });
    tocList.appendChild(li);
});

function setActiveChapter(id) {
    document.querySelectorAll('.toc-list li').forEach(function(el) {
        el.classList.toggle('active', el.dataset.id === id);
    });
    renderChapter(id);
    if (window.innerWidth <= 820) {
        contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function renderChapter(id) {
    var ch = null;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === id) { ch = chapters[i]; break; }
    }
    if (!ch) return;
    var annotationHtml = '';
    ch.annotation.forEach(function(a) {
        annotationHtml += '<div class="block"><strong>' + a.label + '</strong> ' + a.text + '</div>';
    });
    contentArea.innerHTML = '<div class="chapter-card active">' +
        '<div class="top-nav">' +
        '<div class="ref-left">📖 八佾篇 · ' + ch.id + '<span class="tag">第六天</span></div>' +
        '<div class="day-nav">' +
        '<a href="day5.html" class="day-btn">← 前一天</a>' +
        '<span class="day-label">📅 第六天</span>' +
        '<a href="day7.html" class="day-btn">后一天 →</a>' +
        '</div>' +
        '</div>' +
        '<h3>' + ch.title + '</h3>' +
        '<div class="original">' + ch.original + '</div>' +
        '<div class="translation"><strong>白话译文：</strong>' + ch.translation + '</div>' +
        '<div class="annotation">' + annotationHtml + '</div>' +
        '<div class="deep"><i>🧠 内核</i> ' + ch.deep + '</div>' +
        '<div class="meta-note">' +
        '<span>🔗 章节 ' + ch.id + '</span>' +
        '<span style="display:flex;gap:0.8rem;">' +
        '<span id="prevBtn" style="cursor:pointer;color:#7f6952;">← 上一章</span>' +
        '<span id="nextBtn" style="cursor:pointer;color:#7f6952;">下一章 →</span>' +
        '</span></div></div>';

    var idx = -1;
    for (var j = 0; j < chapters.length; j++) {
        if (chapters[j].id === id) { idx = j; break; }
    }
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    if (prevBtn) {
        prevBtn.addEventListener('click', function() {
            if (idx > 0) setActiveChapter(chapters[idx - 1].id);
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id);
        });
    }
}

// 支持从金句页跳转，自动定位到指定章节
(function() {
    var hash = window.location.hash.replace('#', '');
    var found = false;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === hash) { found = true; break; }
    }
    setActiveChapter(found ? hash : chapters[0].id);
})();
</script>
</body>
</html>
