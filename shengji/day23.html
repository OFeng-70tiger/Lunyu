        .toc-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }

<script>
var chapters = [
    {
        id: '7.25',
        title: '钓而不纲，弋不射宿',
        original: '子钓而不纲，弋不射宿。',
        translation: '孔子钓鱼但不用大网，射鸟但不射归巢的鸟。',
        annotation: [
            { label: '🎣 钓而不纲', text: '钓鱼但不用大网。纲，大网。' },
            { label: '🏹 弋不射宿', text: '射鸟但不射归巢的鸟。弋（yì），用带绳的箭射鸟。宿，归巢。' }
        ],
        deep: '这句话讲孔子的仁爱之心。钓鱼可以，但不用大网一网打尽；射鸟可以，但不射归巢的鸟。取之有度，不赶尽杀绝。与7.9“子食于有丧者之侧”一脉相承。'
    },
    {
        id: '7.26',
        title: '多闻多见',
        original: '子曰：“盖有不知而作之者，我无是也。多闻，择其善者而从之，多见而识之，知之次也。”',
        translation: '孔子说：“大概有不知道却凭空创作的人，我没有这样。多听，选择好的学习；多看，并且记住。这是次一等的知。”',
        annotation: [
            { label: '❓ 不知而作', text: '不知道却凭空创作。' },
            { label: '🚫 我无是也', text: '我没有这样。' },
            { label: '👂 多闻', text: '多听。' },
            { label: '✅ 择其善者而从之', text: '选择好的学习。' },
            { label: '👀 多见而识之', text: '多看并记住。' },
            { label: '📊 知之次也', text: '这是次一等的知。' }
        ],
        deep: '孔子反对凭空创作，主张多闻多见。多听，择善而从；多看，记住。这是次一等的知，最高的是“生而知之”。但孔子说自己不是生而知之，所以多闻多见就是他的方法。与7.18“我非生而知之者”一脉相承。'
    },
    {
        id: '7.27',
        title: '互乡难与言',
        original: '互乡难与言，童子见，门人惑。子曰：“与其进也，不与其退也，唯何甚？人洁己以进，与其洁也，不保其往也。”',
        translation: '互乡这个地方的人难以交谈，互乡的一个少年求见孔子，弟子们疑惑。孔子说：“我赞成他进步，不赞成他退步，何必太过分？人家洁身自好以求进步，我赞成他的洁身自好，不追究他的过去。”',
        annotation: [
            { label: '📍 互乡', text: '地名，风气不好。' },
            { label: '🤐 难与言', text: '难以交谈。' },
            { label: '👦 童子见', text: '互乡的一个少年求见孔子。' },
            { label: '❓ 门人惑', text: '弟子们疑惑。' },
            { label: '✅ 与其进也', text: '赞成他进步。' },
            { label: '🚫 不与其退也', text: '不赞成他退步。' },
            { label: '💡 唯何甚', text: '何必太过分。' },
            { label: '🧼 洁己以进', text: '洁身自好以求进步。' },
            { label: '🔄 不保其往', text: '不追究他的过去。' }
        ],
        deep: '互乡风气不好，弟子们不愿见那个少年。孔子却说：人家来求进步，我就该鼓励，何必揪着过去不放？这是孔子的宽容和鼓励后进。与5.22“不念旧恶”一脉相承。'
    },
    {
        id: '7.28',
        title: '我欲仁，斯仁至矣',
        original: '子曰：“仁远乎哉？我欲仁，斯仁至矣。”',
        translation: '孔子说：“仁离我们很远吗？我想要仁，仁就来了。”',
        annotation: [
            { label: '❓ 仁远乎哉', text: '仁离我们很远吗？' },
            { label: '❤️ 我欲仁', text: '我想要仁。' },
            { label: '✅ 斯仁至矣', text: '仁就来了。' }
        ],
        deep: '这是《论语》中最鼓舞人心的话之一。仁不远，就在你一念之间。你想行仁，仁就来了。关键在“欲”——你有没有这个心。与4.6“有能一日用其力于仁矣乎”、6.28“己欲立而立人”一脉相承。'
    },
    {
        id: '7.29',
        title: '丘也幸，苟有过，人必知之',
        original: '陈司败问：“昭公知礼乎？”孔子曰：“知礼。”孔子退，揖巫马期而进之，曰：“吾闻君子不党，君子亦党乎？君取于吴，为同姓，谓之吴孟子。君而知礼，孰不知礼？”巫马期以告。子曰：“丘也幸，苟有过，人必知之。”',
        translation: '陈司败问：“鲁昭公懂礼吗？”孔子说：“懂礼。”孔子退下后，陈司败向巫马期作揖，请他上前，说：“我听说君子不偏袒，君子也偏袒吗？鲁昭公娶了吴国女子，同为姬姓，却称她为吴孟子。鲁昭公如果懂礼，谁不懂礼？”巫马期把这话告诉孔子。孔子说：“我真幸运，如果有过错，别人一定会知道。”',
        annotation: [
            { label: '👤 陈司败', text: '陈国司寇。' },
            { label: '👑 昭公', text: '鲁昭公。' },
            { label: '🤝 揖巫马期', text: '向巫马期作揖。' },
            { label: '🎭 党', text: '偏袒。' },
            { label: '💍 君取于吴', text: '鲁昭公娶吴国女子。取，通“娶”。' },
            { label: '🏷️ 为同姓', text: '吴国和鲁国同为姬姓。' },
            { label: '🍀 丘也幸', text: '我真幸运。' },
            { label: '⚠️ 苟有过', text: '如果有过错。' }
        ],
        deep: '鲁昭公娶同姓女子，违反周礼。陈司败问孔子，孔子说“知礼”，是为君主讳。但陈司败指出后，孔子坦然承认：“丘也幸，苟有过，人必知之。”孔子不是不认错，而是闻过则喜。与1.8“过则勿惮改”一脉相承。'
    },
    {
        id: '7.30',
        title: '子与人歌而善',
        original: '子与人歌而善，必使反之，而后和之。',
        translation: '孔子和别人一起唱歌，如果别人唱得好，一定请他再唱一遍，然后自己跟着唱。',
        annotation: [
            { label: '🎤 与人歌', text: '和别人一起唱歌。' },
            { label: '✅ 而善', text: '唱得好。' },
            { label: '🔁 必使反之', text: '一定请他再唱一遍。' },
            { label: '🎶 而后和之', text: '然后自己跟着唱。' }
        ],
        deep: '这句话写孔子的谦逊和好学。别人唱得好，他请人再唱一遍，然后跟着学。这不就是“三人行必有我师”的实践吗？与7.20“三人行，必有我师焉”一脉相承。'
    },
    {
        id: '7.31',
        title: '文，莫吾犹人也',
        original: '子曰：“文，莫吾犹人也。躬行君子，则吾未之有得。”',
        translation: '孔子说：“文化知识，大概我和别人差不多。至于亲身实践君子之道，我还没有做到。”',
        annotation: [
            { label: '📚 文', text: '文化知识。' },
            { label: '📊 莫吾犹人', text: '大概我和别人差不多。莫，大概。' },
            { label: '🏃 躬行君子', text: '亲身实践君子之道。' },
            { label: '❌ 未之有得', text: '还没有做到。' }
        ],
        deep: '孔子自谦：文化知识，我和别人差不多；但躬身实践君子之道，我还没做到。这说明孔子最看重的不是知识，而是实践。与7.23“子以四教：文、行、忠、信”一脉相承。'
    },
    {
        id: '7.32',
        title: '丘之祷久矣',
        original: '子疾病，子路请祷。子曰：“有诸？”子路对曰：“有之。《诔》曰：‘祷尔于上下神祇。’”子曰：“丘之祷久矣。”',
        translation: '孔子病重，子路请求祈祷。孔子说：“有这回事吗？”子路回答说：“有。《诔》上说：‘为你向天神地祇祈祷。’”孔子说：“我祈祷很久了。”',
        annotation: [
            { label: '🤒 疾病', text: '病重。' },
            { label: '🙏 请祷', text: '请求祈祷。' },
            { label: '❓ 有诸', text: '有这回事吗？' },
            { label: '📖 《诔》', text: '祈祷文。' },
            { label: '⛰️ 上下神祇', text: '天神地祇。' },
            { label: '⏳ 丘之祷久矣', text: '我祈祷很久了。' }
        ],
        deep: '孔子病重，子路要为他祈祷。孔子问“有这回事吗”，子路引《诔》为证。孔子说：我祈祷很久了。意思是：我平时行事合乎道义，就是最好的祈祷。与6.20“敬鬼神而远之”、7.19“子不语怪力乱神”一脉相承。'
    }
];

var tocList = document.getElementById('tocList');
var contentArea = document.getElementById('contentArea');

chapters.forEach(function(ch) {
    var li = document.createElement('li');
    li.dataset.id = ch.id;
    li.innerHTML = '<span class="num">' + ch.id + '</span><span>' + ch.title + '</span><span class="badge">…</span>';
    li.addEventListener('click', function() { setActiveChapter(ch.id); });
    tocList.appendChild(li);
});

function setActiveChapter(id) {
    document.querySelectorAll('.toc-list li').forEach(function(el) {
        el.classList.toggle('active', el.dataset.id === id);
    });
    renderChapter(id);
    if (window.innerWidth <= 820) {
        contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function renderChapter(id) {
    var ch = null;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === id) { ch = chapters[i]; break; }
    }
    if (!ch) return;
    var annotationHtml = '';
    ch.annotation.forEach(function(a) {
        annotationHtml += '<div class="block"><strong>' + a.label + '</strong> ' + a.text + '</div>';
    });
    contentArea.innerHTML = '<div class="chapter-card active">' +
        '<div class="top-nav">' +
        '<div class="ref-left">📖 述而篇 · ' + ch.id + '<span class="tag">第二十三天</span></div>' +
        '<div class="day-nav">' +
        '<a href="day22.html" class="day-btn">← 前一天</a>' +
        '<span class="day-label">📅 第二十三天</span>' +
        '<a href="day24.html" class="day-btn">后一天 →</a>' +
        '</div>' +
        '</div>' +
        '<h3>' + ch.title + '</h3>' +
        '<div class="original">' + ch.original + '</div>' +
        '<div class="translation"><strong>白话译文：</strong>' + ch.translation + '</div>' +
        '<div class="annotation">' + annotationHtml + '</div>' +
        '<div class="deep"><i>🧠 内核</i> ' + ch.deep + '</div>' +
        '<div class="meta-note">' +
        '<span>🔗 章节 ' + ch.id + '</span>' +
        '<span style="display:flex;gap:0.8rem;">' +
        '<span id="prevBtn" style="cursor:pointer;color:#7f6952;">← 上一章</span>' +
        '<span id="nextBtn" style="cursor:pointer;color:#7f6952;">下一章 →</span>' +
        '</span></div></div>';

    var idx = -1;
    for (var j = 0; j < chapters.length; j++) {
        if (chapters[j].id === id) { idx = j; break; }
    }
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    if (prevBtn) {
        prevBtn.addEventListener('click', function() {
            if (idx > 0) setActiveChapter(chapters[idx - 1].id);
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id);
        });
    }
}

(function() {
    var hash = window.location.hash.replace('#', '');
    var found = false;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === hash) { found = true; break; }
    }
    setActiveChapter(found ? hash : chapters[0].id);
})();
</script>
</body>
</html>
