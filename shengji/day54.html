<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论语 · 卫灵公篇 · 第五十四天</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #faf8f5; color: #2c2c2c;
            display: flex; justify-content: center;
            padding: 2rem 1.5rem;
        }
        .app { max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: 2rem; }
        .header { border-bottom: 2px solid #d4c5a0; padding-bottom: 1.2rem; }
        .header h1 { font-size: 2.2rem; font-weight: 500; letter-spacing: 6px; color: #3e2e1f; }
        .header .sub { color: #6b5a44; margin-top: 0.3rem; font-size: 1rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .header .sub span { background: #e8e0d4; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.9rem; }
        .top-btns { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.8rem; }
        .btn { display: inline-block; padding: 0.4rem 1.8rem; border-radius: 40px; font-size: 0.9rem; text-decoration: none; transition: 0.2s; }
        .btn-back { color: #826a4e; background: #f0e9df; border: 1px solid #cbbba8; }
        .btn-back:hover { background: #e8ddd0; border-color: #9b846b; }
        .btn-jinju { color: #6b4f1d; background: linear-gradient(135deg, #f5e6c8, #e8d3a8); border: 1px solid #d4b97a; font-weight: 500; }
        .btn-jinju:hover { background: linear-gradient(135deg, #f0dcb5, #ddc696); border-color: #c5a560; }
        .main { display: flex; flex-direction: row; gap: 2.5rem; align-items: flex-start; }
        .toc { flex: 0 0 260px; background: #fffcf7; border: 1px solid #e2d7c8; border-radius: 18px; padding: 1.5rem 0.8rem 1.5rem 1.5rem; box-shadow: 0 6px 14px rgba(0,0,0,0.02); position: sticky; top: 2rem; max-height: 90vh; overflow-y: auto; }
        .toc h2 { font-size: 1.1rem; font-weight: 600; color: #4d3e2b; letter-spacing: 2px; border-bottom: 1px solid #dacfc0; padding-bottom: 0.8rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 6px; }
        .toc h2 small { font-weight: 400; font-size: 0.8rem; color: #8a7a64; margin-left: auto; }
        .toc-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
        .toc-list li { display: flex; align-items: center; gap: 8px; padding: 0.5rem 0.8rem; border-radius: 12px; cursor: pointer; transition: all 0.15s ease; color: #3d3429; font-size: 0.95rem; border-left: 3px solid transparent; }
        .toc-list li:hover { background: #f0e9df; border-left-color: #b8a48a; }
        .toc-list li.active { background: #eadecd; border-left-color: #8b6f50; font-weight: 500; color: #2c1f12; }
        .toc-list li .badge { background: #dacfc0; color: #3e3225; font-size: 0.7rem; padding: 0.1rem 0.6rem; border-radius: 40px; margin-left: auto; font-weight: 400; }
        .toc-list li .num { font-weight: 400; color: #8f7b62; min-width: 28px; font-size: 0.85rem; }
        .content { flex: 1; background: #fffffffa; border: 1px solid #e8dfd3; border-radius: 20px; padding: 2rem 2.2rem; box-shadow: 0 8px 24px rgba(0,0,0,0.02); min-height: 500px; }
        .chapter-card { display: none; animation: fadeUp 0.25s ease; }
        .chapter-card.active { display: block; }
        @keyframes fadeUp { 0% { opacity: 0.6; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
        .top-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ddd0c0; padding-bottom: 0.6rem; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.6rem; }
        .top-nav .ref-left { font-size: 0.9rem; color: #8a7a64; }
        .top-nav .ref-left .tag { background: #ede6db; padding: 0 0.8rem; border-radius: 40px; font-size: 0.8rem; margin-left: 0.4rem; }
        .day-nav { display: flex; align-items: center; gap: 0.6rem; }
        .day-btn { text-decoration: none; color: #826a4e; background: #f0e9df; border: 1px solid #cbbba8; padding: 0.25rem 1rem; border-radius: 40px; font-size: 0.8rem; transition: 0.2s; display: inline-flex; align-items: center; }
        .day-btn:hover { background: #e8ddd0; border-color: #9b846b; }
        .day-label { font-size: 0.85rem; color: #6b5a44; background: #e8e0d4; padding: 0.25rem 1rem; border-radius: 20px; }
        .chapter-card h3 { font-size: 1.8rem; font-weight: 400; color: #3d2d1c; letter-spacing: 2px; margin-bottom: 0.3rem; }
        .chapter-card .original { background: #f7f2ea; padding: 1rem 1.6rem; border-radius: 16px; font-size: 1.15rem; line-height: 1.8; color: #1f1a14; margin: 1.2rem 0 0.8rem 0; border-left: 6px solid #b7a084; font-weight: 450; }
        .chapter-card .translation { background: #f0f7f0; padding: 0.9rem 1.6rem; border-radius: 14px; font-size: 1.05rem; line-height: 1.8; color: #1f3a1f; margin: 0 0 1.8rem 0; border-left: 6px solid #7ea87e; }
        .chapter-card .translation strong { color: #2e5e2e; font-weight: 600; }
        .chapter-card .annotation { display: flex; flex-direction: column; gap: 1.3rem; }
        .chapter-card .annotation .block { background: #fcfaf7; padding: 0.8rem 1.4rem; border-radius: 14px; border: 1px solid #ece3d8; }
        .chapter-card .annotation .block strong { color: #5f4530; font-weight: 600; display: inline-block; min-width: 48px; }
        .chapter-card .annotation .deep { background: #f6f0e8; border-left: 4px solid #a3876b; padding: 1rem 1.5rem; border-radius: 12px; margin-top: 0.6rem; font-size: 0.98rem; line-height: 1.7; color: #2f261d; }
        .chapter-card .annotation .deep i { color: #6f5b45; font-style: normal; background: #e8ddd0; padding: 0.1rem 0.6rem; border-radius: 30px; font-size: 0.8rem; margin-right: 6px; }
        .meta-note { margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid #e3d8ca; font-size: 0.9rem; color: #756450; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 1.5rem; }
        @media (max-width: 820px) {
            .main { flex-direction: column; }
            .toc { flex: auto; width: 100%; position: relative; top: 0; max-height: none; padding: 1rem; }
            .toc-list { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }
            .toc-list li { flex: 1 0 auto; padding: 0.3rem 0.8rem; border-left: none; border-bottom: 2px solid transparent; }
            .toc-list li.active { border-left: none; border-bottom-color: #8b6f50; }
            .content { padding: 1.5rem 1.2rem; }
            .chapter-card h3 { font-size: 1.5rem; }
            .top-nav { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📖 论语 · 卫灵公篇</h1>
        <div class="sub">
            <span>📅 第五十四天 · 15.22 ~ 15.28</span>
            <span>📘 共 7 章</span>
            <span>✍️ 约 300 字</span>
            <span>🧠 恕道与察人</span>
        </div>
        <div class="top-btns">
            <a href="index.html" class="btn btn-back">🏠 返回总目录</a>
            <a href="lunyu-jinju.html" class="btn btn-jinju">✨ 论语金句</a>
        </div>
    </div>
    <div class="main">
        <nav class="toc">
            <h2>📑 篇目 <small>15.22 ~ 15.28</small></h2>
            <ul class="toc-list" id="tocList"></ul>
            <div style="margin-top:1.2rem; font-size:0.8rem; color:#b09a82; border-top:1px solid #e2d7c8; padding-top:0.8rem;">⚡ 点击章节跳转</div>
        </nav>
        <div class="content" id="contentArea"></div>
    </div>
    <div style="font-size:0.9rem; color:#8c7a64; border-top:1px solid #ddd0c0; padding-top:1.2rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem 1.5rem;">
        <span>📚 今日进度：卫灵公篇 15.22 — 15.28</span>
        <span>🔖 原文 + 译文 + 注解 + 内核</span>
    </div>
</div>
<script>
var chapters = [
    {
        id: '15.22', title: '君子矜而不争，群而不党',
        original: '子曰：“君子矜而不争，群而不党。”',
        translation: '孔子说：“君子庄敬自持，却不与人争；合群相处，却不结党营私。”',
        annotation: [
            { label: '🧘 矜', text: '庄敬自持。' },
            { label: '🚫 不争', text: '不与人争。' },
            { label: '👥 群', text: '合群相处。' },
            { label: '🚫 不党', text: '不结党营私。' }
        ],
        deep: '“君子矜而不争，群而不党”是《论语》中最著名的金句之一。与15.21“君子求诸己”一脉相承。'
    },
    {
        id: '15.23', title: '不以言举人，不以人废言',
        original: '子曰：“君子不以言举人，不以人废言。”',
        translation: '孔子说：“君子不因为一个人说的话好就提拔他，也不因为一个人有缺点就废弃他说的好话。”',
        annotation: [
            { label: '🗣️ 不以言举人', text: '不因为说的话好就提拔他。' },
            { label: '🙅 不以人废言', text: '不因为人有缺点就废弃他说的好话。' }
        ],
        deep: '孔子说不以言举人，不以人废言。与15.22“矜而不争”一脉相承。'
    },
    {
        id: '15.24', title: '己所不欲，勿施于人',
        original: '子贡问曰：“有一言而可以终身行之者乎？”子曰：“其恕乎！己所不欲，勿施于人。”',
        translation: '子贡问：“有没有一个字可以终身奉行的呢？”孔子说：“大概就是‘恕’吧！自己不想要的，不要强加给别人。”',
        annotation: [
            { label: '👤 子贡', text: '端木赐。' },
            { label: '❓ 一言', text: '一个字。' },
            { label: '🙇 恕', text: '恕道。' },
            { label: '🙅 己所不欲，勿施于人', text: '自己不想要的，不要强加给别人。' }
        ],
        deep: '“己所不欲，勿施于人”是《论语》中最著名的金句之一，被称为道德黄金律。与15.23“不以言举人”一脉相承。'
    },
    {
        id: '15.25', title: '谁毁谁誉',
        original: '子曰：“吾之于人也，谁毁谁誉？如有所誉者，其有所试矣。斯民也，三代之所以直道而行也。”',
        translation: '孔子说：“我对于别人，诋毁过谁？称赞过谁？如果有所称赞，一定是经过检验的。夏商周三代的人，就是这样直道而行的。”',
        annotation: [
            { label: '🗣️ 谁毁谁誉', text: '诋毁过谁，称赞过谁。' },
            { label: '✅ 有所试', text: '经过检验。' },
            { label: '🏛️ 三代', text: '夏商周三代。' },
            { label: '🛤️ 直道而行', text: '直道而行。' }
        ],
        deep: '孔子说谁毁谁誉，如有所誉必有所试。与15.24“己所不欲”一脉相承。'
    },
    {
        id: '15.26', title: '史之阙文',
        original: '子曰：“吾犹及史之阙文也。有马者借人乘之，今亡矣夫！”',
        translation: '孔子说：“我还赶得上看到史官存疑缺文的地方。有马的人借给别人骑，现在这种风气没有了啊！”',
        annotation: [
            { label: '📜 史之阙文', text: '史官存疑缺文。' },
            { label: '🐎 有马者借人乘之', text: '有马的人借给别人骑。' },
            { label: '😔 今亡矣夫', text: '现在这种风气没有了啊！' }
        ],
        deep: '孔子感叹史之阙文与借马之风不再。与15.25“谁毁谁誉”一脉相承。'
    },
    {
        id: '15.27', title: '小不忍则乱大谋',
        original: '子曰：“巧言乱德。小不忍则乱大谋。”',
        translation: '孔子说：“花言巧语会败坏道德。小处不能忍耐，就会扰乱大的谋略。”',
        annotation: [
            { label: '🗣️ 巧言乱德', text: '花言巧语败坏道德。' },
            { label: '😤 小不忍', text: '小处不能忍耐。' },
            { label: '⚠️ 乱大谋', text: '扰乱大的谋略。' }
        ],
        deep: '“小不忍则乱大谋”是《论语》中最著名的金句之一。与15.26“史之阙文”一脉相承。'
    },
    {
        id: '15.28', title: '众恶之，必察焉',
        original: '子曰：“众恶之，必察焉；众好之，必察焉。”',
        translation: '孔子说：“大家都厌恶他，一定要考察；大家都喜欢他，也一定要考察。”',
        annotation: [
            { label: '😠 众恶之', text: '大家都厌恶他。' },
            { label: '🔍 必察焉', text: '一定要考察。' },
            { label: '😊 众好之', text: '大家都喜欢他。' },
            { label: '🔍 必察焉', text: '也一定要考察。' }
        ],
        deep: '孔子说众恶之必察、众好之必察。与15.27“小不忍”一脉相承。'
    }
];

var tocList = document.getElementById('tocList');
var contentArea = document.getElementById('contentArea');

chapters.forEach(function(ch) {
    var li = document.createElement('li');
    li.dataset.id = ch.id;
    li.innerHTML = '<span class="num">' + ch.id + '</span><span>' + ch.title + '</span><span class="badge">…</span>';
    li.addEventListener('click', function() { setActiveChapter(ch.id); });
    tocList.appendChild(li);
});

function setActiveChapter(id) {
    document.querySelectorAll('.toc-list li').forEach(function(el) {
        el.classList.toggle('active', el.dataset.id === id);
    });
    renderChapter(id);
    if (window.innerWidth <= 820) {
        contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function renderChapter(id) {
    var ch = null;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === id) { ch = chapters[i]; break; }
    }
    if (!ch) return;
    var annotationHtml = '';
    ch.annotation.forEach(function(a) {
        annotationHtml += '<div class="block"><strong>' + a.label + '</strong> ' + a.text + '</div>';
    });
    contentArea.innerHTML = '<div class="chapter-card active">' +
        '<div class="top-nav">' +
        '<div class="ref-left">📖 卫灵公篇 · ' + ch.id + '<span class="tag">第五十四天</span></div>' +
        '<div class="day-nav">' +
        '<a href="day53.html" class="day-btn">← 前一天</a>' +
        '<span class="day-label">📅 第五十四天</span>' +
        '<a href="day55.html" class="day-btn">后一天 →</a>' +
        '</div></div>' +
        '<h3>' + ch.title + '</h3>' +
        '<div class="original">' + ch.original + '</div>' +
        '<div class="translation"><strong>白话译文：</strong>' + ch.translation + '</div>' +
        '<div class="annotation">' + annotationHtml + '</div>' +
        '<div class="deep"><i>🧠 内核</i> ' + ch.deep + '</div>' +
        '<div class="meta-note">' +
        '<span>🔗 章节 ' + ch.id + '</span>' +
        '<span style="display:flex;gap:0.8rem;">' +
        '<span id="prevBtn" style="cursor:pointer;color:#7f6952;">← 上一章</span>' +
        '<span id="nextBtn" style="cursor:pointer;color:#7f6952;">下一章 →</span>' +
        '</span></div></div>';

    var idx = -1;
    for (var j = 0; j < chapters.length; j++) {
        if (chapters[j].id === id) { idx = j; break; }
    }
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    if (prevBtn) prevBtn.addEventListener('click', function() { if (idx > 0) setActiveChapter(chapters[idx - 1].id); });
    if (nextBtn) nextBtn.addEventListener('click', function() { if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id); });
}

(function() {
    var hash = window.location.hash.replace('#', '');
    var found = false;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === hash) { found = true; break; }
    }
    setActiveChapter(found ? hash : chapters[0].id);
})();
</script>
</body>
</html>
