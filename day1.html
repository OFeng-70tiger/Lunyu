<script>

    {
        id: '1.1',
        title: '学而时习之',
        original: '子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”',
        translation: '孔子说：“学了知识并且经常在实践中运用，不是很愉快吗？有志同道合的同学从远方来，不是很快乐吗？别人不了解我，我也不生气，不就是一个君子吗？”',
        annotation: [
            { label: '📌 时习', text: '“时”指适时、时常；“习”不是温习，而是实践、践行。孔子强调的是知行合一——学了道理，在生活中用出来，内心才会有真实的喜悦。' },
            { label: '🎓 朋与友', text: '在古代，“朋”指同学、同门（同一老师门下学习的人）；“友”才指志同道合的人。同门从远方来，说明你的学问有了影响力，也给了你一个“以友辅仁”的机会。' },
            { label: '🧘 不愠', text: '“愠”是恼怒。别人不了解我，我也不生气。为什么能做到？因为君子的价值不依赖于外界评价，而是源于内心的自足。' },
            { label: '💡 三阶段', text: '这三句话讲的其实是君子修身的三个阶段：① 学而实践 → 内在之“悦”；② 同门切磋 → 外显之“乐”；③ 不为人知而不怨 → 人格自足。' }
        ],
        deep: '整句话的逻辑是：学问之乐，始于实践，成于共鸣，终于自足。三个阶段层层递进，最终指向一个“不依赖外物”的独立人格。这是儒家“为己之学”的核心：学习是为了完善自己，不是为了炫耀给别人看。'
    },
    {
        id: '1.2',
        title: '孝悌为仁之本',
        original: '有子曰：“其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！”',
        translation: '有子说：“一个人孝顺父母、敬爱兄长，却喜欢冒犯上级，这种情况是很少见的；不喜欢冒犯上级，却喜欢作乱，这种人是从来没有的。君子致力于根本，根本立住了，道就自然产生了。孝悌，大概就是仁的根本吧！”',
        annotation: [
            { label: '👨‍👧‍👦 孝弟', text: '“弟”通“悌”，指敬爱兄长。孝悌是家庭伦理的核心，也是社会秩序的起点。' },
            { label: '🌱 务本', text: '君子致力于根本，根本立住了，“道”自然生长。儒家不空谈大道，而是把道落实到“孝悌”这种人人都能做的事上。' },
            { label: '🔗 逻辑', text: '一个在家庭中懂得感恩和秩序的人，到了社会上不会轻易破坏规则、挑战权威。反过来说，作乱的人往往是从家庭关系崩坏开始的。' },
            { label: '💡 本立而道生', text: '这是儒家“下学而上达”的路径：从最朴素的人伦情感出发，逐步通向高远的大道。' }
        ],
        deep: '有子强调：家庭是社会的微缩模型，家庭伦理是社会秩序的根基。一个人连父母都不孝、兄长都不敬，他对社会的破坏就是必然的。“本立而道生”是儒家的核心方法论：不空谈高远的大道，而是把道落实到人人可行的孝悌上。'
    },
    {
        id: '1.3',
        title: '巧言令色，鲜矣仁',
        original: '子曰：“巧言令色，鲜矣仁！”',
        translation: '孔子说：“花言巧语、伪装和善的人，很少有仁德。”',
        annotation: [
            { label: '🎭 巧言', text: '花言巧语，把话说得非常好听、动人，但未必出于真心。' },
            { label: '🎨 令色', text: '“令”本义是“善、美”（如“令尊”“令堂”），“色”指面色、表情。“令色”字面意思是“好的面色”“和善的表情”，但在这里指刻意装出来的和善，是伪善的外在表现。' },
            { label: '⚠️ 关键', text: '问题出在“过度”和“刻意”上——说话好听、表情和善本身没有错，但如果是刻意装出来的、为了讨好别人以达到自己的目的，那就很可疑了。' },
            { label: '💡 朱熹注解', text: '朱熹在《论语集注》里解释：“好其言，善其色，致饰于外，务以悦人。”——把自己的言辞弄好听、表情弄好看，在外表上下足功夫，目的就是取悦他人。这种人“鲜矣仁”。' }
        ],
        deep: '孔子极其厌恶“巧言令色”的人，因为这类人用言语和表情来掩盖真实的动机。这背后是孔子对“真诚”的极端重视。“仁”的核心是真心待人，而巧言令色恰恰是把真心藏起来，用一种表演来替代真实的感情。孔子说“刚毅木讷近仁”，又说“君子欲讷于言而敏于行”，在他看来，话太多太漂亮的人，往往在行动上靠不住。'
    },
    {
        id: '1.4',
        title: '吾日三省吾身',

        annotation: [
            { label: '🔄 三省', text: '“三”指多次，非确数。每天从三个维度反省：忠、信、习。' },
            { label: '💼 忠', text: '“尽己之谓忠”——替人办事尽心竭力，不敷衍、不偷懒。这是对上级或委托者的态度。' },
            { label: '🤝 信', text: '与朋友交往诚实守信，言行一致。这是对平辈的态度。' },
            { label: '📖 传不习', text: '老师传授的学问，有没有实践？这是对知识最大的尊重，也是对自我的要求。' },
            { label: '🎯 三关系', text: '三个维度覆盖了人对上级、对平辈、对己身三种关系，每天都在这三个层面自查，是一个完整的修身闭环。' }
        ],
        deep: '曾子的反省覆盖了三种关系：对上级/委托者（忠）、对平辈/朋友（信）、对自身/学问（习）。这是一个完整的修身闭环。“省”字是关键——不是泛泛地反思，而是像照镜子一样，一件件具体的事拿出来检视，这就是儒家修身的功夫。'
    },
    {

        title: '道千乘之国',

        translation: '孔子说：“治理一个拥有千辆兵车的国家，要严谨认真地办事、恪守信用，节约用度、爱护百姓，役使民众要在农闲时节。”',
        annotation: [
            { label: '⚔️ 千乘之国', text: '“乘”指兵车，一乘约75人。千乘之国兵力约7.5万，在春秋属大国（如吴、越），约相当于今一两个省的大小。' },
            { label: '👑 敬事而信', text: '执政者对待政事要“敬”——敬畏、认真、不轻慢；同时要“信”——言出必行，政策稳定，不朝令夕改。这是对权力的自我约束。' },
            { label: '💰 节用而爱人', text: '“节用”不是抠门，而是不搞面子工程、不铺张浪费；“爱人”不是空谈，而是真正体恤百姓疾苦。节省下来的资源要用在百姓身上。' },
            { label: '🌾 使民以时', text: '古代农业社会，农忙时役使民众等于断人生路。孔子特别强调“时”，体现他对老百姓生存权的尊重，对自然规律的敬畏。' }
        ],
        deep: '这是孔子治国思想的浓缩，包含三个层面：对上（权力）要“敬”与“信”——自我约束；对下（百姓）要“节用”与“爱人”——以民为本；对时（自然）要“以时”——不违天时。核心是：执政者要克制自己的欲望，把民众的福祉放在第一位。越大越要克制，这是孔子的政治智慧。'
    },
    {
        id: '1.6',
        title: '行有余力，则以学文',
        original: '子曰：“弟子入则孝，出则弟，谨而信，泛爱众，而亲仁。行有余力，则以学文。”',
        translation: '孔子说：“年轻人在家孝顺父母，出门敬爱兄长，言行谨慎而有信用，广泛地爱护大众，亲近有仁德的人。这些做到了还有余力，再去学习文化知识。”',
        annotation: [
            { label: '🏠 入孝出弟', text: '在家孝顺父母，出门敬爱兄长。家庭伦理是人生第一课，不是知识，而是关系。' },
            { label: '📝 谨而信', text: '言语谨慎、说话算话，这是立身之本。' },
            { label: '❤️ 泛爱众而亲仁', text: '从爱家人扩展到爱众人，但要选择性地“亲仁”（亲近有仁德的人），说明爱不是无差别的，要有价值判断。' },
            { label: '📚 行有余力则学文', text: '前面六件事都是“行”（实践），最后才是“学文”（读书识字）。一个人如果做人的根基没打好，读再多书也是白搭。' }
        ],
        deep: '这句话揭示了孔子教育思想的根本次序：德先于才，做人在先，读书在后。这与今天“唯分数论”的教育观形成了鲜明的对比。孔子的意思很明确——如果做人的根基没打好，读再多书也可能越读越坏（知识用来作恶）。'
    },
    {
        id: '1.7',
        title: '虽曰未学，吾必谓之学矣',
        original: '子夏曰：“贤贤易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信。虽曰未学，吾必谓之学矣。”',
        translation: '子夏说：“看重贤德而轻视美色；侍奉父母能竭尽全力；事奉君主能献出生命；与朋友交往说话算话。这样的人即使自谦说没学过，我也认为他学成了。”',
        annotation: [
            { label: '💎 贤贤易色', text: '第一个“贤”是动词（看重），第二个“贤”是名词（贤德），“易色”是轻视美色。这句话放在最前面，表明一个人价值观的排序：德重于色，内在重于外在。' },
            { label: '🛡️ 致其身', text: '事奉君主能献出生命，指全力以赴、不顾私利。' },
            { label: '👥 四伦', text: '四件事覆盖了四种关系：夫妻（贤贤易色）、父子（事父母）、君臣（事君）、朋友（与朋友交）。这四伦都做到了，人伦之道就完整了。' },
            { label: '🎓 学的新定义', text: '子夏把“学”从读书识字拓展到了做人做事。一个人即使不认识字，只要在这些关系中都做对了，他就是真正“有学问”的人。' }
        ],
        deep: '“虽曰未学，吾必谓之学矣”是点睛之笔：实践才是学问的真谛。这与1.6“行有余力则以学文”一脉相承——孔子和弟子们把“学”的定义从“读书认字”提升到了“做人做事”的层面。'
    },
    {
        id: '1.8',
        title: '过则勿惮改',
        original: '子曰：“君子不重则不威，学则不固。主忠信，无友不如己者。过则勿惮改。”',
        translation: '孔子说：“君子不庄重就没有威严，所学的东西就不牢固。以忠信为主，不和道德上不如自己的人交朋友。有了过错，不要怕改正。”',
        annotation: [
            { label: '⚖️ 重', text: '庄重、稳重。不是摆架子，而是一种内在的稳重。一个人轻浮、随便，说话没人信服，学的东西也落实不到行动上。' },
            { label: '💼 主忠信', text: '以忠信为立身之本。忠是尽己，信是践言，这是做人的两根支柱。' },
            { label: '🧑‍🤝‍🧑 无友不如己者', text: '这句话争议很大，但合理的理解是：不要和道德上不如自己的人深交（或理解为：没有朋友是不如自己的，要看到每个人的长处）。择友要慎重，朋友会影响你的德行。' },
            { label: '🛠️ 过则勿惮改', text: '“惮”是害怕、畏难。有了过错不要怕改正——不要怕丢脸，不要拖延。' }
        ],
        deep: '这句话讲的是君子自我修养的四要素：庄重、忠信、慎友、改过。最务实的是“过则勿惮改”——人非圣贤，孰能无过？关键是“惮”字，惮是害怕、畏难。很多人不改过，不是不知道错，而是没勇气面对、没决心改正。孔子鼓励的是：错了就改，别怕丢脸，别拖延。'
    },
    {
        id: '1.9',
        title: '慎终追远，民德归厚',
        original: '曾子曰：“慎终追远，民德归厚矣。”',
        translation: '曾子说：“慎重地办理丧事，追念远代祖先，民众的品德就会归于淳厚。”',
        annotation: [
            { label: '⚰️ 慎终', text: '慎重办理丧事。不是形式主义，而是通过仪式表达对父母的哀痛与感恩。当一个人跪在灵前，想起父母的生养之恩，那种发自内心的悲痛和感恩，会冲刷掉平时的功利算计。' },
            { label: '🧬 追远', text: '追念远代祖先。把个人生命放到家族传承的长河中看待，培养“承上启下”的责任感。当你意识到自己今天的一切都源于祖先一代代的付出，就会产生一种责任感，不再只图眼前利益。' },
            { label: '❤️ 感恩', text: '感恩是道德的总开关。知道“欠”父母的、欠祖先的，人就有了底线和敬畏。一个懂得感恩的人，会更宽容、更有责任感、更不容易作恶。' },
            { label: '🏛️ 政治智慧', text: '孔子和曾子都深知，单纯靠法律禁令来约束民众是低效的。真正的长治久安，要靠民风的“厚”。而民风变厚，最好的切入点就是丧祭之礼，因为这里面有天然的悲悯和感恩。' }
        ],
        deep: '这句话有三层递进的道理：① 形式背后是情感——丧祭之礼承载着“情”，是感恩的具象化表达；② 由家及国——孝从生前延伸到身后，从父母扩展到祖先，是“推恩”逻辑；③ 感恩是道德的总开关——民风变“厚”，社会自然安稳。慎终追远绝不是形式主义，而是通过仪式感来触动人内心最深处的敬畏和感恩。'
    }
];

const tocList = document.getElementById('tocList');
const contentArea = document.getElementById('contentArea');

chapters.forEach(ch => {
    const li = document.createElement('li');
    li.dataset.id = ch.id;
    li.innerHTML = `<span class="num">${ch.id}</span><span>${ch.title}</span><span class="badge">…</span>`;
    li.addEventListener('click', () => setActiveChapter(ch.id));
    tocList.appendChild(li);
});

function setActiveChapter(id) {
    document.querySelectorAll('.toc-list li').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
    });
    renderChapter(id);
    if (window.innerWidth <= 820) {
        contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function renderChapter(id) {
    const ch = chapters.find(c => c.id === id);
    if (!ch) return;
    let annotationHtml = '';
    ch.annotation.forEach(a => {
        annotationHtml += `<div class="block"><strong>${a.label}</strong> ${a.text}</div>`;
    });
    contentArea.innerHTML = `
        <div class="chapter-card active">
            <div class="ref"><span>📖 学而篇 · ${ch.id}</span><span class="tag">第一天</span></div>
            <h3>${ch.title}</h3>
            <div class="original">${ch.original}</div>
            <div class="translation"><strong>白话译文：</strong>${ch.translation}</div>
            <div class="annotation">${annotationHtml}</div>
            <div class="deep"><i>🧠 内核</i> ${ch.deep}</div>
            <div class="meta-note">
                <span>🔗 章节 ${ch.id}</span>
                <span style="display:flex;gap:0.8rem;">
                    <span id="prevBtn" style="cursor:pointer;color:#7f6952;">← 上一章</span>
                    <span id="nextBtn" style="cursor:pointer;color:#7f6952;">下一章 →</span>
                </span>
            </div>
        </div>
    `;
    const idx = chapters.findIndex(c => c.id === id);
    document.getElementById('prevBtn')?.addEventListener('click', () => {
        if (idx > 0) setActiveChapter(chapters[idx - 1].id);
    });
    document.getElementById('nextBtn')?.addEventListener('click', () => {
        if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id);
    });
}

setActiveChapter(chapters[0].id);
</script>
