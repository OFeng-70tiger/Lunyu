<script>
var chapters = [
    {
        id: '3.17',
        title: '尔爱其羊，我爱其礼',
        original: '子贡欲去告朔之饩羊。子曰：“赐也！尔爱其羊，我爱其礼。”',
        translation: '子贡想把每月初一告庙用的活羊去掉。孔子说：“赐啊！你可惜那只羊，我可惜的是那种礼。”',
        annotation: [
            { label: '📅 告朔', text: '每月初一诸侯告庙听政之礼。' },
            { label: '🐑 饩羊', text: '告朔时用的活羊。饩（xì）。' },
            { label: '👤 赐', text: '子贡的名。' },
            { label: '❤️ 爱', text: '可惜、舍不得。' }
        ],
        deep: '告朔之礼到孔子时代已经名存实亡——诸侯不再亲自告庙，只留下一只羊做样子。子贡觉得既然礼已经没了，何必浪费一只羊？孔子却说：你可惜羊，我可惜礼。形式虽然空了，但保留形式，至少还留着一个符号，提醒人们曾经有过这种礼。一旦连形式都去掉，礼就彻底消失了。'
    },
    {
        id: '3.18',
        title: '事君尽礼，人以为谄也',
        original: '子曰：“事君尽礼，人以为谄也。”',
        translation: '孔子说：“完全按照礼制侍奉君主，别人却以为是在谄媚。”',
        annotation: [
            { label: '👑 事君尽礼', text: '完全按照礼制侍奉君主。' },
            { label: '🙇 谄', text: '谄媚。' }
        ],
        deep: '这句话道出了孔子的无奈。按礼制侍奉君主，本来是天经地义的事，但在礼崩乐坏的时代，大家都已经不守礼了，你一个人守礼，反而显得“不正常”，被人当成谄媚。这背后是世风日下的悲哀：当所有人都违背礼制时，守礼的人反而成了异类。'
    },
    {
        id: '3.19',
        title: '君使臣以礼，臣事君以忠',
        original: '定公问：“君使臣，臣事君，如之何？”孔子对曰：“君使臣以礼，臣事君以忠。”',
        translation: '鲁定公问：“君主役使臣子，臣子侍奉君主，该怎么做？”孔子回答说：“君主役使臣子要按礼制，臣子侍奉君主要尽忠心。”',
        annotation: [
            { label: '👑 定公', text: '鲁定公，鲁国国君。' },
            { label: '🤝 使', text: '使用、役使。' },
            { label: '🙇 事', text: '侍奉。' }
        ],
        deep: '这句话讲的是君臣关系的对等性。孔子没有单方面要求臣子尽忠，而是先说君使臣以礼，再说臣事君以忠。意思是：君主先要以礼待臣，臣子才会以忠事君。这与后世“君要臣死，臣不得不死”的愚忠完全不同。孔子认为君臣关系是双向的：君有君道，臣有臣道。'
    },
    {
        id: '3.20',
        title: '关雎，乐而不淫，哀而不伤',
        original: '子曰：“《关雎》，乐而不淫，哀而不伤。”',
        translation: '孔子说：“《关雎》这首诗，快乐而不放纵，哀愁而不痛苦。”',
        annotation: [
            { label: '📖 《关雎》', text: '《诗经》第一篇。' },
            { label: '🎭 淫', text: '过度、放纵。' },
            { label: '💔 伤', text: '损害、痛苦过度。' }
        ],
        deep: '《关雎》写的是君子对淑女的追求：追求时“辗转反侧”，是哀；得到后“琴瑟友之”，是乐。但无论哀还是乐，都恰到好处，不过度。孔子用“乐而不淫，哀而不伤”来评价，体现了中庸之道：情感可以表达，但要节制。快乐不过分，悲哀不伤身。'
    },
    {
        id: '3.21',
        title: '哀公问社于宰我',
        original: '哀公问社于宰我。宰我对曰：“夏后氏以松，殷人以柏，周人以栗，曰：使民战栗。”子闻之，曰：“成事不说，遂事不谏，既往不咎。”',
        translation: '鲁哀公问宰我关于社主的事。宰我回答说：“夏朝用松木，殷朝用柏木，周朝用栗木，意思是让百姓害怕得发抖。”孔子听到后，说：“已经做了的事不必再解释，已经完成的事不必再劝阻，已经过去的事不必再追究。”',
        annotation: [
            { label: '🌳 社', text: '土地神，这里指社主（木制牌位）。' },
            { label: '👤 宰我', text: '宰予，孔子弟子。' },
            { label: '🌲 夏后氏', text: '夏朝。以松：用松木。' },
            { label: '😨 使民战栗', text: '让百姓害怕得发抖。' }
        ],
        deep: '宰我的回答有问题——他把“栗”解释为“使民战栗”，这是在暗示周朝用栗木是为了威慑百姓。这不符合周朝礼制的本意，也容易让鲁哀公产生误解。孔子没有直接批评宰我，而是说了三句话：“成事不说，遂事不谏，既往不咎。”这既是对宰我的委婉批评，也是对鲁哀公的提醒。'
    },
    {
        id: '3.22',
        title: '管仲之器小哉',
        original: '子曰：“管仲之器小哉！”或曰：“管仲俭乎？”曰：“管氏有三归，官事不摄，焉得俭？”“然则管仲知礼乎？”曰：“邦君树塞门，管氏亦树塞门；邦君为两君之好，有反坫，管氏亦有反坫。管氏而知礼，孰不知礼？”',
        translation: '孔子说：“管仲的器量真小啊！”有人说：“管仲节俭吗？”孔子说：“管仲有三处府邸，官员不兼职，怎么算节俭？”“那么管仲懂礼吗？”孔子说：“国君宫殿前有屏墙，管仲家也有屏墙；国君招待别国君主时有放酒杯的土台，管仲家也有。管仲如果懂礼，谁不懂礼？”',
        annotation: [
            { label: '👤 管仲', text: '齐国名相，辅佐齐桓公称霸。' },
            { label: '🍶 器小', text: '器量小。' },
            { label: '🏠 三归', text: '一说指三处府邸，一说指赋税归己。' },
            { label: '🚧 塞门', text: '国君宫殿前的屏墙。' },
            { label: '🍷 反坫', text: '国君招待别国君主时放酒杯的土台。坫（diàn）。' }
        ],
        deep: '管仲是齐国名相，辅佐齐桓公称霸，功业很大。但孔子批评他“器小”——器量小，格局不够。因为管仲虽然功业大，但个人生活奢侈，且僭越礼制：他有三处府邸，官员不兼职，还用了国君才能用的屏墙和反坫。孔子认为：管仲虽然有功于齐国，但他没有做到“以礼自守”，所以器量小。'
    },
    {
        id: '3.23',
        title: '始作翕如也',
        original: '子语鲁大师乐，曰：“乐其可知也：始作，翕如也；从之，纯如也，皦如也，绎如也，以成。”',
        translation: '孔子对鲁国太师讲音乐，说：“音乐是可以知道的：开始演奏时，和谐整齐；展开之后，纯净和谐，清晰分明，连绵不断，然后完成。”',
        annotation: [
            { label: '🎵 大师', text: '太师，乐官。' },
            { label: '🎼 翕如', text: '和谐、整齐的样子。翕（xī）。' },
            { label: '✨ 纯如', text: '纯净、和谐。' },
            { label: '🔍 皦如', text: '清晰、分明。皦（jiǎo）。' },
            { label: '🔗 绎如', text: '连绵不断。' }
        ],
        deep: '孔子用五个词描述音乐的演奏过程：翕如、纯如、皦如、绎如、以成。这是音乐的美学，也是人生的隐喻：开始时要和谐整齐，展开时要纯净和谐，要清晰分明，要连绵不断，最终完成。这与2.4“吾十有五而志于学”一脉相承：人生也像一首乐曲，有开始、展开、高潮、收尾，每个阶段都要恰到好处。'
    },
    {
        id: '3.24',
        title: '仪封人请见',
        original: '仪封人请见，曰：“君子之至于斯也，吾未尝不得见也。”从者见之。出曰：“二三子何患于丧乎？天下之无道也久矣，天将以夫子为木铎。”',
        translation: '仪地的边防官请求见孔子，说：“有德行的人到这里，我没有不见的。”孔子的随从引他见了孔子。他出来后说：“你们何必担心失去官位呢？天下无道已经很久了，上天将把夫子当作木铎来传道。”',
        annotation: [
            { label: '📍 仪', text: '地名。封人：管理边疆的官。' },
            { label: '👋 请见', text: '请求见孔子。' },
            { label: '👥 二三子', text: '你们这些人。' },
            { label: '🔔 木铎', text: '木舌的铜铃，古代宣布政教法令时用。' }
        ],
        deep: '仪封人是一个边防小官，但他眼光非凡。他见了孔子后，对孔子的弟子说：你们何必担心失去官位？天下无道已经很久了，上天将把夫子当作木铎来传道。“木铎”是古代宣布政令时用的铃铛。仪封人的意思是：孔子虽然现在不得志，但他是上天派来传播大道的人。这是对孔子使命的最高肯定。'
    },
    {
        id: '3.25',
        title: '子谓《韶》，尽美矣，又尽善也',
        original: '子谓《韶》：“尽美矣，又尽善也。”谓《武》：“尽美矣，未尽善也。”',
        translation: '孔子评论《韶》乐：“形式美极了，内容也好极了。”评论《武》乐：“形式美极了，但内容还不够好。”',
        annotation: [
            { label: '🎵 《韶》', text: '舜时的乐曲。' },
            { label: '🎵 《武》', text: '周武王时的乐曲。' },
            { label: '🌸 尽美', text: '形式完美。' },
            { label: '💛 尽善', text: '内容完善。' }
        ],
        deep: '孔子评价两种音乐：《韶》是舜时的音乐，舜以禅让得天下，尽美又尽善；《武》是周武王时的音乐，武王以征伐得天下，尽美但未尽善。孔子的标准是：美是形式，善是内容。形式和内容要统一，美和善要兼备。'
    },
    {
        id: '3.26',
        title: '居上不宽，为礼不敬',
        original: '子曰：“居上不宽，为礼不敬，临丧不哀，吾何以观之哉？”',
        translation: '孔子说：“居于上位却不宽厚，举行礼仪却不恭敬，参加丧事却不哀痛，我还有什么可看的呢？”',
        annotation: [
            { label: '👑 居上', text: '居于上位。' },
            { label: '🤝 宽', text: '宽厚。' },
            { label: '🙏 为礼', text: '举行礼仪。' },
            { label: '😢 临丧', text: '参加丧事。' }
        ],
        deep: '这是《八佾篇》的收尾之章，也是孔子对礼崩乐坏的总结。他举了三种情况：居上不宽，失去民心；为礼不敬，流于形式；临丧不哀，失去真情。孔子说“吾何以观之哉”——我还有什么可看的呢？如果连这些最基本的都做不到，那还有什么可看的？'
    }
];

var tocList = document.getElementById('tocList');
var contentArea = document.getElementById('contentArea');

chapters.forEach(function(ch) {
    var li = document.createElement('li');
    li.dataset.id = ch.id;
    li.innerHTML = '<span class="num">' + ch.id + '</span><span>' + ch.title + '</span><span class="badge">…</span>';
    li.addEventListener('click', function() { setActiveChapter(ch.id); });
    tocList.appendChild(li);
});

function setActiveChapter(id) {
    document.querySelectorAll('.toc-list li').forEach(function(el) {
        el.classList.toggle('active', el.dataset.id === id);
    });
    renderChapter(id);
    if (window.innerWidth <= 820) {
        contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function renderChapter(id) {
    var ch = null;
    for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].id === id) { ch = chapters[i]; break; }
    }
    if (!ch) return;
    var annotationHtml = '';
    ch.annotation.forEach(function(a) {
        annotationHtml += '<div class="block"><strong>' + a.label + '</strong> ' + a.text + '</div>';
    });
    contentArea.innerHTML = '<div class="chapter-card active">' +
        '<div class="ref"><span>📖 八佾篇 · ' + ch.id + '</span><span class="tag">第八天</span></div>' +
        '<h3>' + ch.title + '</h3>' +
        '<div class="original">' + ch.original + '</div>' +
        '<div class="translation"><strong>白话译文：</strong>' + ch.translation + '</div>' +
        '<div class="annotation">' + annotationHtml + '</div>' +
        '<div class="deep"><i>🧠 内核</i> ' + ch.deep + '</div>' +
        '<div class="meta-note">' +
        '<span>🔗 章节 ' + ch.id + '</span>' +
        '<span style="display:flex;gap:0.8rem;">' +
        '<span id="prevBtn" style="cursor:pointer;color:#7f6952;">← 上一章</span>' +
        '<span id="nextBtn" style="cursor:pointer;color:#7f6952;">下一章 →</span>' +
        '</span></div></div>';

    var idx = -1;
    for (var j = 0; j < chapters.length; j++) {
        if (chapters[j].id === id) { idx = j; break; }
    }
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    if (prevBtn) {
        prevBtn.addEventListener('click', function() {
            if (idx > 0) setActiveChapter(chapters[idx - 1].id);
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            if (idx < chapters.length - 1) setActiveChapter(chapters[idx + 1].id);
        });
    }
}

setActiveChapter(chapters[0].id);
</script>
</body>
</html>
