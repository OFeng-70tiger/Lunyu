<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论语 · 金句汇总</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #faf8f5; color: #2c2c2c;
            display: flex; justify-content: center;
            padding: 2rem 1.5rem;
        }
        .app { max-width: 900px; width: 100%; display: flex; flex-direction: column; gap: 2rem; }

        .header { border-bottom: 2px solid #d4c5a0; padding-bottom: 1.2rem; }
        .header h1 { font-size: 2rem; font-weight: 500; letter-spacing: 6px; color: #3e2e1f; }
        .header .sub { color: #6b5a44; margin-top: 0.5rem; font-size: 0.95rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        .header .sub span { background: #e8e0d4; padding: 0.2rem 0.9rem; border-radius: 20px; font-size: 0.85rem; }
        .back-btn {
            display: inline-block; margin-top: 0.8rem;
            color: #826a4e; background: #f0e9df;
            border: 1px solid #cbbba8; padding: 0.4rem 1.8rem;
            border-radius: 40px; font-size: 0.9rem;
            text-decoration: none; transition: 0.2s;
        }
        .back-btn:hover { background: #e8ddd0; border-color: #9b846b; }

        .intro-text {
            font-size: 0.9rem; line-height: 1.8; color: #5a4a38;
            padding: 0.8rem 1.2rem;
            background: #fffcf7; border-left: 4px solid #b7a084;
            border-radius: 10px;
            border: 1px solid #e2d7c8;
        }
        .intro-text .tip {
            display: block; margin-top: 0.5rem;
            font-size: 0.85rem; color: #8a7a64;
        }

        .grid-wrap {
            background: #fffcf7; border: 1px solid #e2d7c8;
            border-radius: 20px; padding: 1.5rem 1.8rem;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
        }
        .grid-wrap h2 {
            font-size: 1.15rem; font-weight: 600; color: #4d3e2b;
            letter-spacing: 1px; border-bottom: 1px solid #dacfc0;
            padding-bottom: 0.7rem; margin-bottom: 0.9rem;
            display: flex; align-items: center; gap: 8px;
        }
        .grid-wrap h2 small { font-weight: 400; font-size: 0.8rem; color: #8a7a64; margin-left: auto; }
        .grid-tip {
            font-size: 0.8rem; color: #8a7a64; margin-bottom: 1rem;
            padding: 0.5rem 0.9rem; background: #f6f0e8;
            border-radius: 8px;
        }
        .grid-tip strong { color: #5f4530; }
        .jinju-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.55rem;
        }
        .jinju-cell {
            display: flex; flex-direction: column; align-items: center;
            padding: 0.6rem 0.5rem; border-radius: 10px;
            background: #f7f2ea; transition: 0.15s;
            text-align: center;
        }
        .jinju-cell:hover { background: #ede6db; }
        .jinju-cell .name {
            font-size: 0.85rem; font-weight: 500; color: #3d2d1c;
            text-decoration: none; cursor: pointer;
            border-bottom: 1px dashed #cbbba8;
            margin-bottom: 0.35rem;
            line-height: 1.3;
        }
        .jinju-cell .name:hover { color: #8b6f50; border-bottom-color: #8b6f50; }
        .jinju-cell .ref {
            font-size: 0.7rem; color: #8a7a64;
            text-decoration: none;
            background: #e8e0d4; padding: 0.1rem 0.55rem;
            border-radius: 40px; transition: 0.15s;
        }
        .jinju-cell .ref:hover { background: #dacfc0; color: #5f4530; }

        .detail-section {
            background: #fffcf7; border: 1px solid #e2d7c8;
            border-radius: 20px; padding: 1.5rem 1.8rem;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
        }
        .detail-section h2 {
            font-size: 1.15rem; font-weight: 600; color: #4d3e2b;
            letter-spacing: 1px; border-bottom: 1px solid #dacfc0;
            padding-bottom: 0.7rem; margin-bottom: 1.2rem;
            display: flex; align-items: center; gap: 8px;
        }
        .detail-section h2 small { font-weight: 400; font-size: 0.8rem; color: #8a7a64; margin-left: auto; }
        .detail-card {
            background: #fcfaf7; border: 1px solid #ece3d8;
            border-radius: 14px; padding: 1rem 1.4rem;
            margin-bottom: 1rem; scroll-margin-top: 2rem;
        }
        .detail-card:last-child { margin-bottom: 0; }
        .detail-card .title {
            font-size: 1.1rem; font-weight: 600; color: #3d2d1c;
            margin-bottom: 0.3rem; display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap;
        }
        .detail-card .title .ref {
            font-size: 0.75rem; font-weight: 400; color: #8a7a64;
            background: #ede6db; padding: 0.1rem 0.7rem; border-radius: 40px;
        }
        .detail-card .meaning {
            font-size: 0.95rem; color: #2f261d; line-height: 1.7;
            margin-bottom: 0.5rem;
        }
        .detail-card .meaning strong { color: #5f4530; }
        .detail-card .scene {
            font-size: 0.9rem; color: #6b5a44; line-height: 1.7;
            background: #f6f0e8; border-left: 4px solid #a3876b;
            padding: 0.6rem 1rem; border-radius: 10px;
        }
        .detail-card .scene strong { color: #5f4530; }
        .detail-card .learn-link {
            margin-top: 0.6rem; font-size: 0.85rem;
        }
        .detail-card .learn-link a {
            color: #826a4e; text-decoration: none;
            background: #f0e9df; border: 1px solid #cbbba8;
            padding: 0.2rem 1rem; border-radius: 40px;
            transition: 0.15s; display: inline-block;
        }
        .detail-card .learn-link a:hover { background: #e8ddd0; border-color: #9b846b; }

        .footer-note {
            text-align: center; font-size: 0.9rem; color: #8c7a64;
            border-top: 1px solid #ddd0c0; padding-top: 1.5rem;
            display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            body { padding: 1.2rem 0.8rem; }
            .header h1 { font-size: 1.5rem; letter-spacing: 3px; }
            .grid-wrap, .detail-section { padding: 1rem; }
            .jinju-grid { grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
            .jinju-cell .name { font-size: 0.78rem; }
        }
        @media (max-width: 380px) {
            .jinju-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📖 论语金句</h1>
        <div class="sub">
            <span>📘 已学 8 天</span>
            <span>✨ 共 20 条</span>
            <span>🔍 点击跳转</span>
        </div>
        <a href="index.html" class="back-btn">🏠 返回总目录</a>
    </div>

    <div class="intro-text">
        我们日常挂在嘴边的许多成语，其实都出自《论语》。只是用得久了，便忘了它的来处。这里把出自《论语》的金句与成语汇于一处，既是一份速查，也是一次寻根。
        <span class="tip">📌 出处编号说明：如“1.1”表示第一篇《学而篇》第一章，“2.4”表示第二篇《为政篇》第四章，以此类推。</span>
    </div>

    <div class="grid-wrap">
        <h2>📋 金句一览 <small>点击金句看解释，点击出处跳章节</small></h2>
        <div class="grid-tip">
            <strong>点击金句名</strong> → 查看下方释义与应用场景　|　<strong>点击出处编号</strong> → 跳转到对应学习章节
        </div>
        <div class="jinju-grid" id="jinjuGrid"></div>
    </div>

    <div class="detail-section">
        <h2>📖 详细解释与应用 <small>点击上方金句跳转至此</small></h2>
        <div id="detailArea"></div>
    </div>

    <div class="footer-note">
        <span>📚 每天 200 字 · 三个月通读</span>
        <span>🔖 一年四遍 · 熟读精思</span>
    </div>
</div>

<script>
var entries = [
    {
        id: 'bylh', name: '不亦乐乎', ref: '1.1', refName: '学而篇第一章', page: 'day1.html',
        meaning: '原意是“不也是很快乐吗”，形容学习实践、朋友相聚的喜悦。现在多用来形容忙得很起劲、很热闹。',
        scene: '朋友聚会、工作忙碌时自嘲。“今天忙得不亦乐乎。”'
    },
    {
        id: 'qyls', name: '巧言令色', ref: '1.3', refName: '学而篇第三章', page: 'day1.html',
        meaning: '花言巧语，伪装和善。形容用言语和表情讨好别人，但内心不真诚。',
        scene: '形容虚伪的人。“他最擅长巧言令色，你可别被忽悠了。”'
    },
    {
        id: 'sxws', name: '三省吾身', ref: '1.4', refName: '学而篇第四章', page: 'day1.html',
        meaning: '每天多次反省自己。形容严于律己、经常自我检讨。',
        scene: '自我反省、团队复盘。“每天三省吾身，才能不断进步。”'
    },
    {
        id: 'yeyx', name: '言而有信', ref: '1.7', refName: '学而篇第七章', page: 'day1.html',
        meaning: '说话算数，讲信用。形容承诺了就一定做到。',
        scene: '评价一个人的信用。“他这个人言而有信，可以放心合作。”'
    },
    {
        id: 'szzy', name: '慎终追远', ref: '1.9', refName: '学而篇第九章', page: 'day1.html',
        meaning: '慎重办理丧事，追念祖先。引申为不忘根本、感恩先人。',
        scene: '清明祭祖、家族传承。“慎终追远，民德归厚。”'
    },
    {
        id: 'wlgjr', name: '温良恭俭让', ref: '1.10', refName: '学而篇第十章', page: 'day2.html',
        meaning: '温和、善良、恭敬、俭朴、谦让。形容人格修养全面，待人接物有分寸。',
        scene: '形容有修养的人。“他温良恭俭让，谁都愿意跟他共事。”'
    },
    {
        id: 'hwg', name: '和为贵', ref: '1.12', refName: '学而篇第十二章', page: 'day2.html',
        meaning: '以和谐为贵。形容处理关系时以和睦为重。',
        scene: '家庭、团队、外交。“礼之用，和为贵，大家各退一步。”'
    },
    {
        id: 'rqrc', name: '如切如磋', ref: '1.15', refName: '学而篇第十五章', page: 'day2.html',
        meaning: '像加工玉石一样切磋琢磨。形容精益求精、反复打磨。',
        scene: '学术讨论、技艺精进。“做学问要如切如磋，如琢如磨。”'
    },
    {
        id: 'ssel', name: '三十而立', ref: '2.4', refName: '为政篇第四章', page: 'day3.html',
        meaning: '三十岁能立身于社会。形容人到三十，应有所成就和担当。',
        scene: '人生阶段总结。“三十而立，该有自己的事业了。”'
    },
    {
        id: 'ssbh', name: '四十不惑', ref: '2.4', refName: '为政篇第四章', page: 'day3.html',
        meaning: '四十岁不再迷惑。形容人到中年，对是非方向有了清晰判断。',
        scene: '人生感悟。“四十不惑，很多事看开了。”'
    },
    {
        id: 'ztm', name: '知天命', ref: '2.4', refName: '为政篇第四章', page: 'day3.html',
        meaning: '五十岁懂得天命。形容明白自己的使命和局限，不再怨天尤人。',
        scene: '中年感悟。“五十知天命，尽力而为，顺其自然。”'
    },
    {
        id: 'wgzx', name: '温故知新', ref: '2.11', refName: '为政篇第十一章', page: 'day4.html',
        meaning: '温习旧知识，获得新理解。形容在旧内容里发现新意义。',
        scene: '学习、复习、复盘。“温故而知新，可以为师矣。”'
    },
    {
        id: 'jzbq', name: '君子不器', ref: '2.12', refName: '为政篇第十二章', page: 'day4.html',
        meaning: '君子不像器皿只有一种用途。形容不自我设限，追求通才与格局。',
        scene: '职业发展、人才培养。“君子不器，别把自己限定在一个岗位上。”'
    },
    {
        id: 'xebs', name: '学而不思则罔', ref: '2.15', refName: '为政篇第十五章', page: 'day4.html',
        meaning: '只学不思会迷惑，只思不学会危险。形容学和思必须结合。',
        scene: '学习方法、教育。“学而不思则罔，光刷题不总结是没用的。”'
    },
    {
        id: 'zzwz', name: '知之为知之', ref: '2.17', refName: '为政篇第十七章', page: 'day5.html',
        meaning: '知道就是知道，不知道就是不知道。形容诚实面对自己的认知边界。',
        scene: '求知、科研、做人。“知之为知之，不知为不知，是知也。”'
    },
    {
        id: 'ewbx', name: '人而无信', ref: '2.22', refName: '为政篇第二十二章', page: 'day5.html',
        meaning: '人没有信用，不知道他怎么能行。形容信用是立身之本。',
        scene: '评价信用、合作。“人而无信，不知其可也，这单生意不能跟他做。”'
    },
    {
        id: 'skrs', name: '是可忍孰不可忍', ref: '3.1', refName: '八佾篇第一章', page: 'day6.html',
        meaning: '这都能容忍，还有什么不能容忍？形容对某件事忍无可忍。',
        scene: '表达愤怒、底线被触碰。“他居然做出这种事，是可忍孰不可忍！”'
    },
    {
        id: 'qxqx', name: '巧笑倩兮', ref: '3.8', refName: '八佾篇第八章', page: 'day6.html',
        meaning: '笑容美好，眼睛明亮。形容女子容貌美丽动人。',
        scene: '文学描写、赞美。“巧笑倩兮，美目盼兮，形容美人再合适不过。”'
    },
    {
        id: 'jwbb', name: '既往不咎', ref: '3.21', refName: '八佾篇第二十一章', page: 'day8.html',
        meaning: '已经过去的事不再追究。形容宽容、向前看。',
        scene: '和解、团队重启。“既往不咎，咱们重新开始。”'
    },
    {
        id: 'jmjs', name: '尽美尽善', ref: '3.25', refName: '八佾篇第二十五章', page: 'day8.html',
        meaning: '形式美极了，内容也好极了。形容事物完美无缺。',
        scene: '评价作品、方案。“这个方案尽美尽善，无可挑剔。”'
    }
];

var jinjuGrid = document.getElementById('jinjuGrid');
var detailArea = document.getElementById('detailArea');

// 渲染网格
entries.forEach(function(e) {
    var cell = document.createElement('div');
    cell.className = 'jinju-cell';
    // 出处链接带上章节 hash，跳到 day 页面后自动定位
    cell.innerHTML = '<a href="#' + e.id + '" class="name">' + e.name + '</a>' +
                     '<a href="' + e.page + '#' + e.ref + '" class="ref" title="点击跳转到' + e.refName + '">' + e.ref + '</a>';
    jinjuGrid.appendChild(cell);
});

// 渲染详情
entries.forEach(function(e) {
    var card = document.createElement('div');
    card.className = 'detail-card';
    card.id = e.id;
    card.innerHTML = '<div class="title">' + e.name +
                     '<span class="ref">' + e.refName + '（' + e.ref + '）</span></div>' +
                     '<div class="meaning"><strong>释义：</strong>' + e.meaning + '</div>' +
                     '<div class="scene"><strong>使用场景：</strong>' + e.scene + '</div>' +
                     '<div class="learn-link"><a href="' + e.page + '#' + e.ref + '">📖 去学习这一章 →</a></div>';
    detailArea.appendChild(card);
});

// 平滑滚动（锚点）
document.querySelectorAll('a[href^="#"]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        var target = document.querySelector(this.getAttribute('href'));
        if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    });
});
</script>
</body>
</html>
